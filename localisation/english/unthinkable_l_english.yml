 # USA War Heritage & New Focuses
 USA_war_department: "War Department Mobilization"
 USA_war_department_desc: "The expansion of the War Department oversaw the greatest mobilization of American manpower and industrial might in history."
 USA_fair_labour_standards_act: "Fair Labor Standards Act"
 USA_fair_labour_standards_act_desc: "Ensuring baseline wages and conditions secured industrial peace and record factory output throughout the war."
 USA_agricultural_adjustment_act: "Agricultural Adjustment Act"
 USA_agricultural_adjustment_act_desc: "Federal crop stabilization guaranteed that Allied nations and fighting forces never suffered food shortages."
 USA_the_giant_wakes: "The Giant Wakes"
 USA_the_giant_wakes_desc: "American industry transformed into the undisputed Arsenal of Democracy."
 USA_war_plan_orange: "War Plan Orange"
 USA_war_plan_orange_desc: "Decades of strategic planning prepared the US Navy for the island-hopping campaign across the Pacific."
 USA_intervention_in_asia: "Pacific Front Commitment"
 USA_intervention_in_asia_desc: "Carrier strike groups and Marines broke the outer defenses of Imperial Japan."
 USA_strategic_bombing: "Strategic Bombing Doctrine"
 USA_strategic_bombing_desc: "The US Army Air Forces proved that precision strategic daylight bombing could dismantle an enemy's industrial core."
 USA_air_war_plans_division: "Air War Plans Division"
 USA_air_war_plans_division_desc: "Long-range bombers and escort fighters won total air superiority over Europe and Asia."
 USA_war_plans_division: "General Staff War Plans"
 USA_war_plans_division_desc: "George C. Marshall and Dwight Eisenhower orchestrated global operations on multiple continents."
 USA_intervention_in_europe: "Liberation of Europe"
 USA_intervention_in_europe_desc: "From Normandy to the Elbe, American GIs fought shoulder-to-shoulder with Allied forces to defeat Nazi tyranny."
 USA_war_plan_black: "War Plan Black"
 USA_war_plan_black_desc: "Contingency planning for continental defense and forward theater garrisons."
 USA_baruch_plan_ultimatum: "The Baruch Plan Ultimatum"
 USA_baruch_plan_ultimatum_desc: "Present the United Nations with a proposal for international atomic control with severe sanctions on clandestine enrichment. If Stalin refuses inspection, America will retain her atomic monopoly with moral clarity."
 USA_tactical_nuclear_deployment: "Tactical Nuclear Readiness"
 USA_tactical_nuclear_deployment_desc: "Should the Red Army attempt to advance past the demarcation lines, our atomic bombs will not be held in reserve—they will be deployed directly against Soviet armored spearheads in Germany."
 USA_potsdam_unyielding_stance: "Unyielding Stance at Potsdam"
 USA_potsdam_unyielding_stance_desc: "President Truman will not yield to Soviet demands on Poland, reparations, or unilateral boundary revisions."
 USA_b36_peacemaker_program: "B-36 Peacemaker Program"
 USA_b36_peacemaker_program_desc: "The world's first intercontinental bomber will guarantee that no adversary on Earth is beyond the reach of American deterrence."
 USA_cancel_soviet_lend_lease: "Halt Soviet Lend-Lease"
 USA_cancel_soviet_lend_lease_desc: "All remaining shipments of trucks, high-octane fuel, and locomotives to the Soviet Union are immediately stopped and diverted to US forces in Europe."

 # Britain War Heritage & New Focuses
 uk_industrial_focus: "British Industrial Mobilization"
 uk_industrial_focus_desc: "British factories worked through the Blitz to arm the nation and supply her allies."
 shadow_scheme_focus: "The Shadow Factories"
 shadow_scheme_focus_desc: "Converting automotive assembly lines into aircraft and engine plants sustained the RAF in its darkest hours."
 ENG_steady_as_she_goes: "Steady as She Goes"
 ENG_steady_as_she_goes_desc: "National discipline and rationing held the home front together through years of total war."
 uk_empire_focus: "The British Empire"
 uk_empire_focus_desc: "Millions of soldiers from across the globe answered the call to defend freedom."
 uk_colonial_focus: "Colonial Reinforcements"
 uk_colonial_focus_desc: "African, Caribbean, and Pacific colonies contributed vital manpower and raw materials."
 uk_mediterranean_focus: "Fortress Mediterranean"
 uk_mediterranean_focus_desc: "Gibraltar, Malta, and Alexandria kept the vital Mediterranean sea lanes open."
 uk_asia_focus: "Singapore and Far East Fortifications"
 uk_asia_focus_desc: "Defending the imperial outposts in Asia against imperialist aggression."
 uk_commonwealth_focus: "Commonwealth Solidarity"
 uk_commonwealth_focus_desc: "Canada, Australia, New Zealand, and South Africa stood steadfast beside the United Kingdom."
 limited_rearmament_focus: "Rearmament of the Realm"
 limited_rearmament_focus_desc: "Britain's rearmament before 1939 laid the technological groundwork for victory."
 air_defense_focus: "Fighter Command Air Defense"
 air_defense_focus_desc: "Hugh Dowding's integrated air defense system secured victory in the Battle of Britain."
 radar_focus: "Chain Home Radar Network"
 radar_focus_desc: "Early warning radar stations turned the tide in the skies above the Channel."
 ENG_vickers_experimental_facility_focus: "Vickers Experimental Facility"
 ENG_vickers_experimental_facility_focus_desc: "British engineering developed pioneering armor, anti-tank guns, and specialized armor."
 uk_service_focus: "National Service Act"
 uk_service_focus_desc: "Conscription mobilized every able-bodied citizen for total victory."
 ENG_operation_backfire_cuxhaven: "Operation Backfire"
 ENG_operation_backfire_cuxhaven_desc: "British engineers and captured German rocket scientists test-fire V-2 rockets at Cuxhaven to master ballistic missile technology."
 ENG_anglo_american_nuclear_accord: "Quebec Nuclear Accord"
 ENG_anglo_american_nuclear_accord_desc: "Demand that Washington honor the 1943 Quebec Agreement regarding the joint development and consultation of atomic weapons."
 ENG_free_polish_corps_offensive: "Deploy Anders' Polish Vanguard"
 ENG_free_polish_corps_offensive_desc: "General Władysław Anders' II Polish Corps, seasoned by the bloody struggle at Monte Cassino, is re-equipped with modern British armor to lead the liberation of Poland."
 ENG_iron_curtain_speech: "Sinews of Peace"
 ENG_iron_curtain_speech_desc: "From Stettin in the Baltic to Trieste in the Adriatic, an iron curtain has descended across the Continent. Britain calls for an unbreakable Western alliance to deter further expansion."

 # USSR War Heritage & New Focuses
 SOV_heavy_industry: "Soviet Heavy Industry"
 SOV_heavy_industry_desc: "Massive industrial combines laid the foundation for Soviet economic and military resilience."
 SOV_infrastructure_effort_nsb: "National Transport Infrastructure"
 SOV_infrastructure_effort_nsb_desc: "Expanding the rail lines connected the boundless expanses of the Motherland."
 SOV_develop_the_urals: "Ural Industrial Fortress"
 SOV_develop_the_urals_desc: "Developing the mineral riches and industrial capacity of the Urals beyond the reach of enemy bombers."
 SOV_finish_the_five_year_plan: "Fulfill the Five-Year Plan"
 SOV_finish_the_five_year_plan_desc: "Stakhanovite labor and central planning fulfilled economic targets ahead of schedule."
 SOV_the_ussr_academy_of_sciences: "USSR Academy of Sciences"
 SOV_the_ussr_academy_of_sciences_desc: "Soviet scientific institutions fostered breakthroughs in metallurgy, physics, and synthetic materials."
 SOV_expand_the_agitprop: "Agitprop Mobilization"
 SOV_expand_the_agitprop_desc: "Political agitation and patriotic fervor galvanized the Soviet people in defense of the socialist motherland."
 SOV_found_the_pcdi: "People's Commissariat of Internal Affairs"
 SOV_found_the_pcdi_desc: "The state security apparatus maintained absolute vigilance against subversion and fifth columns."
 SOV_baltic_security: "Baltic Frontier Security"
 SOV_baltic_security_desc: "Securing the strategic approaches to Leningrad and the Gulf of Finland."
 SOV_national_specialists: "Cadres of National Specialists"
 SOV_national_specialists_desc: "Educating a new generation of Soviet engineers, officers, and administrators."
 SOV_eastern_development: "Far Eastern Industrial Development"
 SOV_eastern_development_desc: "Building factories, ports, and fortifications in Siberia and the Pacific coast."
 SOV_transpolar_flights: "Heroic Transpolar Flights"
 SOV_transpolar_flights_desc: "Chkalov and Gromov proved the endurance and reach of Soviet aviation to the entire world."
 SOV_great_patriotic_war: "The Great Patriotic War"
 SOV_great_patriotic_war_desc: "A sacred war of national survival that broke the back of the fascist beast from Moscow and Stalingrad to the ruins of Berlin."
 SOV_expand_the_red_fleet: "Red Fleet Modernization"
 SOV_expand_the_red_fleet_desc: "The Soviet Navy defended coastal flanks and secured convoy routes in the Arctic and Baltic."
 SOV_order_227: "Order No. 227: Not a Step Back!"
 SOV_order_227_desc: "In the darkest days of 1942, the iron will of the Red Army and Party halted the enemy's onslaught."
 SOV_fall_of_berlin: "Victory over Fascism"
 SOV_fall_of_berlin_desc: "On May 2, 1945, the Red Banner of Victory flew triumphantly over the Reichstag."
 SOV_pc_of_the_ussr_navy: "People's Commissariat of the Navy"
 SOV_pc_of_the_ussr_navy_desc: "Centralized naval administration directed northern and eastern shipyard expansion."
 SOV_the_threat_from_the_land_of_the_rising_sun: "Far Eastern Threat Evaluation"
 SOV_the_threat_from_the_land_of_the_rising_sun_desc: "Monitoring the Japanese Kwantung Army on the borders of Manchuria."
 SOV_support_the_kuomintang: "Chinese Frontier Support"
 SOV_support_the_kuomintang_desc: "Aid to anti-Japanese forces in China tied down Japanese divisions away from Soviet borders."
 SOV_enormoz_atomic_espionage: "Operation Enormoz"
 SOV_enormoz_atomic_espionage_desc: "Our clandestine intelligence network within the Manhattan Project provides Igor Kurchatov with precise technical blueprints, accelerating Soviet atomic bomb research by years."
 SOV_rds1_first_lightning: "First Lightning (RDS-1)"
 SOV_rds1_first_lightning_desc: "A thunderous mushroom cloud rises over the Semipalatinsk test polygon. The imperialist atomic monopoly is broken forever!"
 SOV_potsdam_unyielding_demands: "Unyielding Demands at Potsdam"
 SOV_potsdam_unyielding_demands_desc: "Comrade Stalin insists on total fulfillment of Yalta accords, heavy reparations from the Ruhr, and Western recognition of Poland's western frontiers on the Oder and Neisse."
 SOV_annex_kuril_and_sakhalin: "Liberation of Kuril and Sakhalin"
 SOV_annex_kuril_and_sakhalin_desc: "Returning South Sakhalin and the Kuril Islands to the Soviet Motherland restores historical justice and secures Pacific naval egress."
 industrial_effort: "Postwar Industrial Effort"
 industrial_effort_desc: "Directing national factory throughput to overcome the ruin and wear of wartime production."
 secret_police_idea: "State Security Apparatus"
 secret_police_idea_desc: "Pervasive counter-intelligence and internal security networks neutralize foreign subversion."
 economic_miracle_idea: "Postwar Economic Miracle"
 economic_miracle_idea_desc: "Capital investment, currency stability, and industrial reconstruction generate extraordinary postwar growth."
 unthinkable_sov_launch_august_storm: "Launch Operation August Storm"
 unthinkable_sov_launch_august_storm_desc: "Having transferred veteran shock armies and armor from the ruins of Berlin to the Far East, the Red Army is primed to strike the Kwantung Army, liberate Southern Sakhalin and the Kurils, and fulfill our Yalta pledges."
 unthinkable_sov_august_storm_offensive: "Operation August Storm Offensive"
 unthinkable_sov_august_storm_offensive_desc: "The massive armor-heavy pincer movement across the Gobi Desert and Greater Khingan Mountains utterly shatters Japanese defenses in Manchuria."
 unthinkable.95.t: "Operation August Storm: Red Army Invades Manchuria!"
 unthinkable.95.d: "In a massive, coordinated surprise offensive across thousands of kilometers, Marshal Aleksandr Vasilevsky's Far Eastern forces have crossed the Amur River and breached the fortifications of Manchuria. Three Soviet fronts, supported by the Pacific Fleet and over five thousand tanks and combat aircraft, are executing an overwhelming armored encirclement of the Japanese Kwantung Army."
 unthinkable.95.a: "Crush the militarists in the East!"
 unthinkable.95.b: "The northern frontier has collapsed..."
 unthinkable.95.c: "The Soviet colossus strikes into Asia."
 unthinkable_postwar_folder: "Post-War Research"
 UNTHINKABLE_POSTWAR_FOLDER_TITLE: "Post-War Research (1945–1955)"
