 # LA RESISTANCE - INTELLIGENCE AGENCIES & OPERATIONS (1945)
 # -------------------------------------------------------------------------
 local_resources_factor_tt: "Local Resources: §G+10.0%§!"

 # Operations
 operation_unthinkable_paperclip: "Operation Paperclip"
 operation_unthinkable_paperclip_desc: "Locate, extract, and secure German rocket scientists, aerospace engineers, and advanced weaponry archives before rival occupation forces seize them."
 operation_unthinkable_paperclip_outcome_tt: "§YSecures German rocketry and jet propulsion technical experts§!, awarding significant technological research bonuses and aerial doctrine experience."
 operation_unthinkable_paperclip_bonus: "Operation Paperclip: Rocketry Secrets"
 operation_unthinkable_paperclip_jet_bonus: "Operation Paperclip: Advanced Jet Propulsion"

 operation_unthinkable_atomic_espionage: "Atomic Espionage in Los Alamos"
 operation_unthinkable_atomic_espionage_desc: "Leverage deeply embedded foreign operatives and scientific informants to intercept blueprinted calculations and metallurgical specifications of the atomic bomb."
 operation_unthinkable_atomic_espionage_outcome_tt: "§YAcquires classified design documentation of the implosion nuclear device§!, providing crucial research bonuses to nuclear physics and expanding intelligence coverage."
 operation_unthinkable_atomic_espionage_bonus: "Manhattan Project Technical Blueprint"

 operation_unthinkable_demarcation_recon: "Demarcation Line Infiltration"
 operation_unthinkable_demarcation_recon_desc: "Slip reconnaissance operatives across the occupation demarcation zone to survey forward airfields, rail heads, and armored staging concentrations."
 operation_unthinkable_demarcation_recon_outcome_tt: "§YDelivers detailed strategic mapping of frontier military dispositions§!, yielding vital army and air intelligence."

 operation_unthinkable_crush_win_insurgency: "Neutralize WiN Underground Cells"
 operation_unthinkable_crush_win_insurgency_desc: "Coordinate internal security units and counter-intelligence networks to track down and dismantle anti-communist partisan cells (Freedom and Independence)."
 operation_unthinkable_crush_win_insurgency_outcome_tt: "§YSuppresses partisan guerrilla activity across Poland§!, significantly lowering local resistance levels and pacifying administrative centers."

 operation_unthinkable_werwolf_crackdown: "Werwolf Insurgency Sweep"
 operation_unthinkable_werwolf_crackdown_desc: "Conduct intensive counter-insurgency operations through mountain redoubts and forests to neutralize clandestine Werwolf sleeper cells and hidden armories."
 operation_unthinkable_werwolf_crackdown_outcome_tt: "§YCrushes hidden paramilitary resistance in occupied German territory§!, mitigating sabotage risks and improving regional compliance."
