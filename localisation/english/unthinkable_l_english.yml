l_english:
 unthinkable_decisions_category: "Operation Unthinkable"
 unthinkable_decisions_category_desc: "With the defeat of Germany in Europe, tensions between the Western Allies and the Soviet Union over the fate of Poland and Eastern Europe have reached a breaking point. The British Joint Planning Staff has prepared secret contingency plans to impose the will of the British Empire and the United States upon the USSR."
 unthinkable_draft_war_plans: "Commission Joint Planning Staff Report"
 unthinkable_draft_war_plans_desc: "Order the Armed Forces Joint Planning Staff to draw up plans for a surprise offensive against Soviet forces in Germany and Poland."
 unthinkable_proclaim_federal_republic: "Proclaim the Federal Republic of Germany"
 unthinkable_proclaim_federal_republic_desc: "Unify the Western Allied occupation zones into a democratic German Federal Republic under Chancellor Konrad Adenauer, establishing a self-governing bulwark against Soviet expansionism."
 unthinkable_rearm_wehrmacht_divisions: "Reconstitute Surrendered Wehrmacht Divisions"
 unthinkable_rearm_wehrmacht_divisions_desc: "To offset the numerical superiority of the Red Army in Central Europe, we can re-equip 10 to 12 surrendered German divisions in Schleswig-Holstein under Allied command."
 unthinkable_mobilize_polish_corps: "Rally Polish Armed Forces in the West"
 unthinkable_mobilize_polish_corps_desc: "Integrate General Anders' Polish II Corps and General Maczek's 1st Armoured Division directly into the Allied offensive vanguard."
 unthinkable_ultimatum_to_stalin: "Deliver the Potsdam Ultimatum"
 unthinkable_ultimatum_to_stalin_desc: "Demand that the Soviet Union respect the Yalta agreements, withdraw the Red Army from Poland, and allow genuinely free elections."
 unthinkable_launch_operation: "Execute Operation Unthinkable"
 unthinkable_launch_operation_desc: "Launch the Allied offensive across the Elbe and toward the Oder-Neisse line to liberate Poland and force Soviet withdrawal."
 unthinkable_atomic_ultimatum: "Deliver Atomic Ultimatum to Moscow"
 unthinkable_atomic_ultimatum_desc: "Armed with the atomic weapon proved at Trinity, demand the immediate withdrawal of the Red Army from Poland and Eastern Europe under threat of nuclear bombardment."
 unthinkable_support_polish_underground: "Airdrop Arms to Polish Underground (WiN)"
 unthinkable_support_polish_underground_desc: "Provide secret weapons and funds to the Freedom and Independence (WiN) movement resisting communist subjugation in Poland."
 unthinkable_red_army_onslaught: "Operation Groza: Red Army Onslaught"
 unthinkable_red_army_onslaught_desc: "Having anticipated Allied perfidy, Marshal Zhukov has unleashed the full fury of the Red Army. Millions of veterans strike across Germany toward the Rhine."
 unthinkable_allied_surprise_strike: "Operation Unthinkable: Allied Surprise Assault"
 unthinkable_allied_surprise_strike_desc: "Western armored spearheads strike across the demarcation lines in Germany with supreme surprise, seeking a rapid tactical breakthrough before Soviet mobilization."
 unthinkable_sov_atomic_crash_program: "Soviet Atomic Crash Project"
 unthinkable_sov_atomic_crash_program_desc: "Alerted to American nuclear capabilities, the Soviet leadership has ordered Lavrentiy Beria and Igor Kurchatov to mobilize all resources to construct the Soviet bomb."
 unthinkable_win_insurgency: "WiN Insurgency"
 unthinkable_win_insurgency_desc: "Anti-communist partisans and former Home Army fighters wage an armed underground struggle against the communist authorities across the countryside."

 UNTHINKABLE_1945_NAME: "Operation Unthinkable (1945)"
 UNTHINKABLE_1945_DESC: "July 1, 1945. Germany has fallen, but peace in Europe is an illusion. Strained relations between the Western Allies and the Soviet Union over the fate of Poland and Eastern Europe have reached a crisis point. Winston Churchill has ordered the British Armed Forces to prepare for a surprise offensive against the Red Army."
 ENG_UNTHINKABLE_DESC: "The British Empire stands victorious in Europe, but exhausted. Winston Churchill fears that the Soviet Union poses an existential threat to freedom and democracy in Europe. In extreme secrecy, the Joint Planning Staff has prepared 'Operation Unthinkable'—a plan to strike the Red Army and force a square deal for Poland."
 USA_UNTHINKABLE_DESC: "Under President Harry S. Truman, the United States commands unprecedented industrial and military might. Yet America is deeply engaged in the Pacific against Imperial Japan, and the American public clamors for demobilization. Washington must decide whether to support Britain in standing up to Stalin or prioritize defeating Japan."
 SOV_UNTHINKABLE_DESC: "The Red Army has crushed Nazi Germany and raised the red banner over the Reichstag. Millions of Soviet soldiers occupy Central and Eastern Europe. However, the Soviet homeland lies devastated, its logistics are stretched to the limit, and relations with the former Western allies are rapidly deteriorating."
 FRA_UNTHINKABLE_DESC: "France, liberated and led by General Charles de Gaulle, seeks to reassert its status as a Great Power. French forces occupy their zone in southwest Germany, wary of Anglo-American hegemony and Soviet expansionism."
 POL_UNTHINKABLE_DESC: "Poland has emerged from German terror only to face Soviet subjugation. While a pro-Soviet coalition sits in Warsaw, the legitimate government-in-exile and General Anders' 220,000 Polish soldiers on the Western front stand ready to fight for true Polish independence."
 CZE_UNTHINKABLE_DESC: "The Czechoslovak Republic has risen from the ashes of German occupation, but its sovereignty hangs by a thread. The demarcation line splits the country in two: General Patton's US 3rd Army occupies Plzen and Western Bohemia, while the Red Army occupies Prague, Moravia, and Slovakia. Prague must navigate the escalating clash between East and West."

 unthinkable_war_weariness: "War Weariness"
 unthinkable_war_weariness_desc: "Years of brutal total warfare have drained our nation's patience and reserves. The populace demands peace, reconstruction, and a return to normal life."
 unthinkable_operation_unthinkable_planning: "Operation Unthinkable Planning"
 unthinkable_operation_unthinkable_planning_desc: "Top-secret war plans commissioned by the British War Cabinet to deliver a rapid, decisive strike against Soviet forces in Central Europe."
 unthinkable_pacific_priority: "Pacific Theatre Priority"
 unthinkable_pacific_priority_desc: "The war against Japan is far from over. Military planners must allocate immense manpower, shipping, and equipment to preparations for Operation Downfall."
 unthinkable_demobilization_pressure: "Demobilization Pressure"
 unthinkable_demobilization_pressure_desc: "Citizens and soldiers demand an immediate return home following the defeat of Nazi Germany. Sustaining a massive army in Europe is politically contentious."
 unthinkable_victors_of_berlin: "Victors of Berlin"
 unthinkable_victors_of_berlin_desc: "Having stormed Berlin and broken the Wehrmacht, the Red Army possesses immense combat experience and unbeatable battlefield confidence."
 unthinkable_devastated_heartland: "Devastated Heartland"
 unthinkable_devastated_heartland_desc: "Western Russia, Belarus, and Ukraine lie in ruins. Millions of lives were lost, cities leveled, and industrial hubs destroyed. Rebuilding will take years."
 unthinkable_extended_supply_lines: "Stretched Supply Lines"
 unthinkable_extended_supply_lines_desc: "Supplying hundreds of divisions over a thousand miles of damaged railways and shattered roads from the Volga to the Elbe puts extreme strain on Soviet logistics."
 unthinkable_anders_crusade: "Fight for a Free Poland"
 unthinkable_anders_crusade_desc: "Polish soldiers on the Western Front, having fought from Tobruk to Monte Cassino and Bologna, burn with determination to liberate their homeland from foreign tyranny."

 unthinkable_cze_demarcation_line: "Divided Demarcation Line"
 unthinkable_cze_demarcation_line_desc: "Our homeland is partitioned between General Patton's US 3rd Army in the west and Marshal Konev's Red Army in Prague and the east. Tensions along the demarcation line are palpable."
 unthinkable_cze_skoda_works: "Skoda Works & CKD Arsenal"
 unthinkable_cze_skoda_works_desc: "The historic armaments factories in Plzen, Brno, and Prague are working day and night, producing artillery, armor, and firearms with world-renowned craftsmanship."
 unthinkable_cze_reconstruction: "Spirit of the May Uprising"
 unthinkable_cze_reconstruction_desc: "The heroic fighters of the Prague and May Uprisings have imbued the nation with revolutionary fervor and deep patriotic pride."
 unthinkable_lend_lease_cutoff: "Lend-Lease Cutoff Shock"
 unthinkable_lend_lease_cutoff_desc: "With the outbreak of hostilities against the Western Allies, vital shipments of American Studebaker trucks, locomotives, and high-octane aviation fuel have ceased completely. Soviet logistics face a catastrophic bottleneck."

 # CZECHOSLOVAK FOCUS TREE LOCALISATION
 CZE_two_year_plan: "The Two-Year Economic Plan"
 CZE_two_year_plan_desc: "Mobilize the national economy to reconstruct transport, basic industries, and agricultural output after the devastation of war."
 CZE_nationalize_heavy_industry: "Nationalization Decrees"
 CZE_nationalize_heavy_industry_desc: "Place key mining complexes, heavy metallurgy, and financial institutions under state guardianship to prevent foreign economic exploitation."
 CZE_skoda_reconstruction: "Rebuild the Skoda Works"
 CZE_skoda_reconstruction_desc: "Repair war damages to the industrial complex in Plzen and re-ignite national tank and gun manufacturing."
 CZE_ostrava_coal_and_steel: "Ostrava Coal & Steel Basin"
 CZE_ostrava_coal_and_steel_desc: "Intensify coking coal extraction in the Vitkovice and Karvina basins to fuel domestic steel mills and heavy machinery."
 CZE_ckd_and_praga_arsenal: "CKD & Praga Engineering Works"
 CZE_ckd_and_praga_arsenal_desc: "Expand manufacturing lines at the locomotive and heavy combat vehicle factories in Prague."
 CZE_zbrojovka_brno_and_povazie: "Zbrojovka Brno & Povazska Bystrica"
 CZE_zbrojovka_brno_and_povazie_desc: "Accelerate small arms and munitions production across Moravia and the newly industrialized Slovak valleys."
 CZE_railway_network_expansion: "Prague-Kosice Railway Spine"
 CZE_railway_network_expansion_desc: "Double-track and electrify crucial railway corridors linking Bohemia, Moravia, and Eastern Slovakia."
 CZE_synthetic_fuel_zaluzi: "Zaluzi Synthetic Fuel Complex"
 CZE_synthetic_fuel_zaluzi_desc: "Refurbish the chemical and hydrogenation facilities near Most to guarantee fuel independence for our armored formations."
 CZE_jachymov_uranium_mines: "Jachymov Uranium Reserves"
 CZE_jachymov_uranium_mines_desc: "Secure the world's richest known pitchblende deposits in the Ore Mountains. Both superpowers covet this key atomic mineral."
 CZE_economic_miracle: "Czechoslovak Industrial Rebirth"
 CZE_economic_miracle_desc: "Through discipline, engineering excellence, and central planning, our industrial output exceeds pre-war records."

 CZE_veterans_of_two_fronts: "Veterans of Two Fronts"
 CZE_veterans_of_two_fronts_desc: "Unite soldiers who fought from the steppes of Sokolovo and Dukla with comrades who endured Dunkirk and the skies of Britain."
 CZE_modernize_hetzer_and_armor: "Armor Modernization Program"
 CZE_modernize_hetzer_and_armor_desc: "Refit surviving Hetzers into domestic ST-I tank destroyers and adapt captured German armor components."
 CZE_rebuild_air_force: "Rebuild the Air Arm"
 CZE_rebuild_air_force_desc: "Re-establish the Czechoslovak Air Force under unified central command."
 CZE_avia_s199_production: "Avia S-199 Production"
 CZE_avia_s199_production_desc: "Utilize German airframes and Jumo engines stored in domestic depots to assemble indigenous fighter squadrons."
 CZE_integrate_raf_squadrons: "Integrate RAF Fighter Squadrons"
 CZE_integrate_raf_squadrons_desc: "Welcome home the legendary pilots of the 310th, 312th, and 313th Squadrons flying modern Spitfire Mk IX fighters."
 CZE_heavy_artillery_tradition: "Mastery of Heavy Artillery"
 CZE_heavy_artillery_tradition_desc: "Maintain Czechoslovakia's world-leading position in heavy siege howitzers and rapid-fire field guns."
 CZE_tank_brigade_reorganization: "Armored Brigade Reorganization"
 CZE_tank_brigade_reorganization_desc: "Integrate Western Cromwell tanks with Eastern T-34-85 formations into powerful combined-arms strike forces."
 CZE_jet_aviation_research: "Aero & Avia Jet Propulsion"
 CZE_jet_aviation_research_desc: "Study captured German turbojets to leap directly into the jet era of military aviation."
 CZE_military_general_staff_reform: "Supreme Command Restructuring"
 CZE_military_general_staff_reform_desc: "Establish a cohesive, modern General Staff capable of independent operational planning."

 CZE_legacy_of_may_uprising: "Legacy of the May Uprising"
 CZE_legacy_of_may_uprising_desc: "Channel the national unity and revolutionary courage forged in the streets of Prague into the reconstruction of our sovereign republic."
 CZE_resolve_teschen_crisis: "Address the Teschen Dispute"
 CZE_resolve_teschen_crisis_desc: "Confront the renewed tensions with Poland over Zaolzie and the Silesian borderlands."
 CZE_reclaim_zaolzie: "Assert Sovereignty over Zaolzie"
 CZE_reclaim_zaolzie_desc: "Deploy armed forces to secure the historical borders of the Teschen region against Polish encroachment."
 CZE_teschen_accord: "The Teschen Compromise"
 CZE_teschen_accord_desc: "Negotiate a bilateral border settlement with Warsaw to preserve peace and avoid an unnecessary regional clash."
 CZE_kosice_government_program: "Kosice Government Program"
 CZE_kosice_government_program_desc: "Fulfill the manifesto of the National Front balancing democratic freedoms with socialist reforms."

 CZE_embrace_west: "Embrace Western Democracy"
 CZE_embrace_west_desc: "Re-align Czechoslovak domestic and foreign policy with the Western democracies led by Britain and the United States."
 CZE_secret_talks_patton: "Backchannel with General Patton"
 CZE_secret_talks_patton_desc: "Initiate discreet staff talks with Patton's Third Army headquarters in Plzen to coordinate joint defense."
 CZE_integrate_western_brigade: "Integrate Western Armoured Veterans"
 CZE_integrate_western_brigade_desc: "Place General Alois Liska's Armoured Brigade and veteran RAF fighter pilots at the center of the Czechoslovak armed forces."
 CZE_reject_subcarpathian_diktat: "Repudiate Subcarpathian Cession"
 CZE_reject_subcarpathian_diktat_desc: "Denounce the forced treaty ceding Subcarpathian Ruthenia to the USSR and demand the restoration of pre-war borders."
 CZE_open_demarcation_line: "Open Demarcation Corridor"
 CZE_open_demarcation_line_desc: "Allow Anglo-American divisions to advance across western Bohemia to secure strategic railheads in Prague and Brno."
 CZE_join_unthinkable: "Join Operation Unthinkable"
 CZE_join_unthinkable_desc: "Stand shoulder-to-shoulder with the Western Allies to push the Red Army back beyond the Curzon line."

 CZE_align_with_moscow: "Solidarity with the Soviet Union"
 CZE_align_with_moscow_desc: "Recognize the Soviet Union as our supreme liberator and tie our national destiny to Moscow."
 CZE_arm_workers_militias: "Mobilize the People's Militias"
 CZE_arm_workers_militias_desc: "Distribute weapons to industrial workers and trade unions to create a loyal paramilitary vanguard."
 CZE_ratify_ruthenia_cession: "Ratify Subcarpathian Treaty"
 CZE_ratify_ruthenia_cession_desc: "Formally transfer Subcarpathian Ruthenia to the Ukrainian SSR as a demonstration of eternal fraternal friendship."
 CZE_subordinate_to_konev: "Coordinate with Marshal Konev"
 CZE_subordinate_to_konev_desc: "Integrate our armed forces into the Soviet command structure and prepare to drive Anglo-American forces out of Central Europe."

 CZE_bridge_west_east: "Bridge Between East and West"
 CZE_bridge_west_east_desc: "Maintain an independent course of armed neutrality and peaceful mediation between the superpowers."
 CZE_negotiate_troop_withdrawal: "Demand Mutual Troop Withdrawal"
 CZE_negotiate_troop_withdrawal_desc: "Insist that both American and Soviet occupation armies evacuate Czechoslovak soil concurrently."
 CZE_national_defense_doctrine: "Doctrine of National Fortress"
 CZE_national_defense_doctrine_desc: "Refortify border approaches and adopt a fierce porcupine strategy to deter any foreign aggressor."
 CZE_independent_arms_export: "Independent Arms Exports"
 CZE_independent_arms_export_desc: "Leverage the Skoda and Zbrojovka arsenals to export modern military hardware to independent and non-aligned nations."

 # FRENCH FOCUS TREE LOCALISATION
 FRA_monnet_plan: "The Monnet Modernization Plan"
 FRA_monnet_plan_desc: "Institute the Commissariat general du Plan under Jean Monnet to direct public capital into the reconstruction of core industries."
 FRA_nationalize_energy_and_transport: "Nationalize Energy & Transport"
 FRA_nationalize_energy_and_transport_desc: "Consolidate electrical generation into EDF, coal mining into Charbonnages de France, and rail transit under SNCF."
 FRA_renault_and_heavy_industry: "Reorganize Heavy Industry"
 FRA_renault_and_heavy_industry_desc: "Nationalize automotive plants into the Regie Renault to produce trucks and mechanized carriers for the military."
 FRA_saar_coal_exploitation: "Exploit Saarland Coal Basin"
 FRA_saar_coal_exploitation_desc: "Integrate the coal mines and heavy foundries of the Saar Protectorate directly into the French industrial sphere."
 FRA_modernize_rhine_infrastructure: "Modernize Rhine Transport"
 FRA_modernize_rhine_infrastructure_desc: "Repair bridges and locks along the Rhine and Moselle rivers to accelerate transport between France and our occupation zone."
 FRA_rebuilding_normandy_and_north: "Rebuild Normandy & The North"
 FRA_rebuilding_normandy_and_north_desc: "Reconstruct the leveled dockyards and factories of Le Havre, Rouen, and Lille."
 FRA_marseille_and_mediterranean_ports: "Revitalize Mediterranean Shipyards"
 FRA_marseille_and_mediterranean_ports_desc: "Clear sunken blockships and expand drydocks in Marseille and Toulon."
 FRA_cea_atomic_energy_commission: "Found the CEA"
 FRA_cea_atomic_energy_commission_desc: "Establish the Commissariat a l'Energie Atomique under Frederic Joliot-Curie to lay the foundations of French nuclear science."
 FRA_french_economic_renaissance: "French Industrial Renaissance"
 FRA_french_economic_renaissance_desc: "Through state investment and citizen mobilization, France re-emerges as a foremost economic power in Europe."

 FRA_reorganize_armed_forces: "Reorganize the French Army"
 FRA_reorganize_armed_forces_desc: "Rebuild the French Army under commanders such as General de Lattre de Tassigny and General Leclerc."
 FRA_arl44_heavy_tank: "The ARL 44 Project"
 FRA_arl44_heavy_tank_desc: "Bring the secret heavy tank developed clandestinely during the occupation into full mass production with a 90mm long-barrel cannon."
 FRA_marine_nationale_rebirth: "Rebirth of the Marine Nationale"
 FRA_marine_nationale_rebirth_desc: "Repair the proud battleship Richelieu and commission Jean Bart to restore French naval majesty."
 FRA_panhard_ebr_development: "Panhard EBR Reconnaissance Vehicle"
 FRA_panhard_ebr_development_desc: "Develop eight-wheeled, heavily armed scout cars designed for speed, agility, and firepower."
 FRA_elite_colonial_and_foreign_legion: "Foreign Legion & Colonial Regiments"
 FRA_elite_colonial_and_foreign_legion_desc: "Rally battle-hardened legionnaires and colonial troops to form elite expeditionary divisions."
 FRA_carrier_aviation_arromanches: "Acquire Carrier Arromanches"
 FRA_carrier_aviation_arromanches_desc: "Procure the aircraft carrier HMS Colossus from Britain, renaming her Arromanches to anchor modern French naval aviation."
 FRA_modernize_submarine_fleet: "Advanced Submarine Engineering"
 FRA_modernize_submarine_fleet_desc: "Incorporate captured German Type XXI U-boat technologies into next-generation French submarine designs."
 FRA_jet_propulsion_snecma: "Snecma Jet Engine Laboratories"
 FRA_jet_propulsion_snecma_desc: "Establish Snecma and recruit foreign aeronautical engineers to develop the indigenous Atar turbojet engine."
 FRA_dassault_ouragan_fighter: "Dassault MD 450 Ouragan"
 FRA_dassault_ouragan_fighter_desc: "Contract Marcel Dassault to produce France's first indigenous swept-wing jet fighter."

 FRA_gprf_leadership: "Provisional Government of the Republic"
 FRA_gprf_leadership_desc: "Under General Charles de Gaulle, the Provisional Government leads France out of foreign occupation toward national sovereignty."
 FRA_the_german_question: "The German Question"
 FRA_the_german_question_desc: "Determine France's permanent policy regarding the partitioning and dismemberment of defeated Germany."
 FRA_demand_saarland_protectorate: "Establish Saarland Protectorate"
 FRA_demand_saarland_protectorate_desc: "Separate the Saar from Germany and integrate it as an autonomous economic protectorate under French protection."
 FRA_colonial_union: "The French Union"
 FRA_colonial_union_desc: "Reform the French colonial empire into a unified political framework, securing resources and manpower from North Africa and overseas territories."
 FRA_de_gaulle_grandeur: "Policy of National Grandeur"
 FRA_de_gaulle_grandeur_desc: "Reject subservience to either Washington or Moscow. France must chart her own path as a sovereign great power."
 FRA_rhineland_buffer_state: "Detach the Rhineland"
 FRA_rhineland_buffer_state_desc: "Insist that the Rhineland and Ruhr must remain permanently demilitarized and politically separate from any future German state."
 FRA_european_third_force: "A European Third Force"
 FRA_european_third_force_desc: "Rally continental European states into an independent defensive coalition free from Anglo-Saxon or Soviet domination."
 FRA_ratify_dunkirk_treaty: "Ratify Treaty of Dunkirk"
 FRA_ratify_dunkirk_treaty_desc: "Form a binding mutual defense alliance with Great Britain against any future threat to Western European security."
 FRA_reinforce_rhine_frontline: "Reinforce the Demarcation Line"
 FRA_reinforce_rhine_frontline_desc: "Move the French First Army to forward positions along the border of the Soviet occupation zone in Germany."
 FRA_commit_to_unthinkable: "Commit to Operation Unthinkable"
 FRA_commit_to_unthinkable_desc: "Join Churchill and Truman in a total offensive across Central Europe to expel the Red Army from Germany and Poland."
 FRA_compromise_with_thorez: "Popular Front Compromise"
 FRA_compromise_with_thorez_desc: "Acknowledge the immense electoral strength of Maurice Thorez and the Communist Party, bringing them into government leadership."
 FRA_franco_soviet_pact_renewal: "Reaffirm Franco-Soviet Alliance"
 FRA_franco_soviet_pact_renewal_desc: "Honor the 1944 Franco-Soviet Treaty of Alliance signed in Moscow, maintaining peace and friendship with the USSR."
 FRA_neutralist_france: "Neutralist Foreign Policy"
 FRA_neutralist_france_desc: "Declare France's strict armed neutrality in the escalating conflict between Anglo-American and Soviet empires."

 # EVENTS LOCALISATION
 unthinkable.1.t: "Operation Unthinkable: Joint Planning Staff Report"
 unthinkable.1.d: "On May 22, 1945, the British Cabinet's Joint Planning Staff delivered its top-secret assessment for 'Operation Unthinkable.' The declared overall political goal is 'to impose upon Russia the will of the United States and the British Empire' and secure 'a square deal for Poland.'\n\nThe offensive plan proposes a surprise assault by 47 British and American divisions—supported by Polish forces and up to 12 reconstituted German divisions—striking through Dresden and Stettin toward the Oder-Neisse line. However, the Chiefs of Staff warn that the Red Army currently holds a nearly 3-to-1 numerical advantage in Europe, making a quick victory perilous without total commitment."
 unthinkable.1.a: "Approve the offensive plan — prepare for July 1st!"
 unthinkable.1.b: "Too risky. Prepare the defensive plan instead."

 unthinkable.5.t: "Moscow Denounces Re-arming of Wehrmacht!"
 unthinkable.5.d: "Soviet intelligence has uncovered evidence that British forces in Schleswig-Holstein are preserving German military units and re-arming surrendered Wehrmacht divisions. Marshal Zhukov and Generalissimo Stalin have issued a furious condemnation, accusing the Western Allies of an intolerable betrayal of the Anti-Hitler Coalition."
 unthinkable.5.a: "A shameful and traitorous provocation!"

 unthinkable.10.t: "The Partition of Germany"
 unthinkable.10.d: "With the total surrender of the Third Reich, the Allied Control Council has taken supreme authority over Germany. The country has been divided into British, American, French, and Soviet occupation zones, while Poland has been granted administrative control over territories east of the Oder-Neisse line."
 unthinkable.10.a: "A new order in Europe."

 unthinkable.15.t: "The British General Election: July 1945"
 unthinkable.15.d: "Britain's first general election in nearly a decade has concluded. The British public must choose between Winston Churchill's wartime leadership and Clement Attlee's promises of radical domestic reform."
 unthinkable.15.a: "Churchill remains Prime Minister!"
 unthinkable.15.b: "Labour secures a historic victory under Attlee."

 unthinkable.20.t: "Allied Ultimatum on Eastern Europe"
 unthinkable.20.d: "The Western Allies have delivered a stark diplomatic ultimatum to the Kremlin. Citing violations of the Yalta Declaration on Liberated Europe, they demand an immediate cessation of political arrests in Poland, the restoration of democratic liberties, and the withdrawal of Red Army forces."
 unthinkable.20.a: "Unacceptable imperialist blackmail! Not one step back!"
 unthinkable.20.b: "We cannot afford another catastrophic war. Compromise."

 unthinkable.21.t: "Stalin Rejects the Ultimatum"
 unthinkable.21.d: "Moscow has flatly rejected our demands, labeling them 'insolent provocations' and reaffirming Soviet hegemony over Poland. The moment of decision has arrived: accept Soviet domination of Eastern Europe, or enforce our will by arms."
 unthinkable.21.a: "Then war it is. Execute Operation Unthinkable!"

 unthinkable.25.t: "President Truman's Crossroads"
 unthinkable.25.d: "In Washington, President Truman and the Joint Chiefs of Staff confront a grave dilemma. Winston Churchill urges a joint Allied offensive against Soviet forces in Europe, but US military leadership remains focused on the invasion of Japan (Operation Downfall)."
 unthinkable.25.a: "Stand with Britain: Halt Soviet expansion in Europe!"
 unthinkable.25.b: "The Pacific comes first. We cannot fight two world wars at once."


 unthinkable.30.t: "Trinity: The Dawn of the Atomic Era"
 unthinkable.30.d: "In the New Mexico desert, the Manhattan Project has conducted the world's first detonation of a nuclear weapon. Codenamed 'Trinity', the test was an overwhelming success, unleashing explosive power never before witnessed by mankind. The United States now holds the ultimate military monopoly."
 unthinkable.30.a: "Now I am become Death, the destroyer of worlds."

 unthinkable.31.t: "World News: The First Atomic Detonation"
 unthinkable.31.d: "Reports from North America confirm that American scientists and military personnel have successfully conducted a test detonation of an atomic weapon in the desert of New Mexico. The unprecedented release of nuclear energy marks the terrifying beginning of a new era in human warfare."
 unthinkable.31.a: "The world enters the atomic age."

 unthinkable.40.t: "The Teschen Dispute on the Olza"
 unthinkable.40.d: "Following the defeat of the German occupiers, tensions have flared once again between Czechoslovakia and Poland regarding the border district of Zaolzie (Teschen Silesia). Both nations maintain historical and ethnic claims to this crucial industrial and railway nexus."
 unthinkable.40.a: "Zaolzie is an integral part of the Republic! Reinforce the border."
 unthinkable.40.b: "Conclude an amicable boundary agreement to preserve peace."

 unthinkable.41.t: "Czechoslovak Mobilization on the Olza"
 unthinkable.41.d: "The Czechoslovak government in Prague has deployed military units to the disputed Zaolzie borderland and lodged formal claims on former German territories assigned to Poland in Lower Silesia, specifically Kłodzko. Polish command warns of imminent clashes unless firm measures are taken."
 unthinkable.41.a: "Not one inch of Zaolzie! Mobilize Polish forces and alert Moscow."
 unthinkable.41.b: "Seek bilateral de-escalation with Prague."

 unthinkable.42.t: "The Kremlin Arbitrates: The Teschen Dispute"
 unthinkable.42.d: "Comrade Stalin has summoned delegates from Prague and Warsaw to the Kremlin. The border clash between two prospective socialist allies threatens the cohesion of the Soviet sphere in Central Europe. Moscow's decision will be final and binding."
 unthinkable.42.a: "Enforce the status quo: Czechoslovakia retains Zaolzie; Poland retains Kłodzko."
 unthinkable.42.b: "Award Zaolzie to Poland to reward the Polish Provisional Government."
 unthinkable.42.c: "Support Czechoslovak claims on Kłodzko to secure Bohemian goodwill."

 unthinkable.43.t: "Moscow's Ruling on the Border Dispute"
 unthinkable.43.d: "Marshal Stalin has issued his arbitration on the Czechoslovak-Polish border dispute. Both nations have been instructed to cease military maneuvers immediately and respect the established demarcation line."
 unthinkable.43.a: "The border is settled for now."

 unthinkable.44.t: "Moscow's Ruling on the Border Dispute"
 unthinkable.44.d: "The Soviet arbitration has been delivered in Warsaw. Under heavy pressure from Marshal Stalin, both nations are ordered to accept the current frontier and refrain from armed confrontations."
 unthinkable.44.a: "We accept the fraternal arbitration."

 unthinkable.50.t: "The Potsdam Conference: Cecilienhof Summit"
 unthinkable.50.d: "The leaders of the Grand Alliance assemble at Cecilienhof Palace in Potsdam, outside ruined Berlin. President Harry Truman, Marshal Joseph Stalin, and Prime Minister Winston Churchill—accompanied by his election rival Clement Attlee—meet to decide the postwar fate of Germany, the borders of Poland, and the shape of the global order."
 unthinkable.50.a: "Let us forge a lasting settlement for Europe."
 unthinkable.50.b: "Take an uncompromising stand against Soviet hegemony."

 unthinkable.501.t: "The Potsdam Conference: American Delegation"
 unthinkable.501.d: "President Truman and Secretary of State James Byrnes have taken their seats at the Cecilienhof conference table. America seeks European stability, free elections in liberated nations, and Soviet entry into the war against Japan."
 unthinkable.501.a: "We will negotiate with firm resolve."

 unthinkable.502.t: "The Potsdam Conference: Soviet Delegation"
 unthinkable.502.d: "Marshal Stalin and Foreign Commissar Molotov represent the triumphant Soviet Union. Having borne the brunt of the war against Hitler, the Soviet Union demands security, rightful reparations from German industry, and friendly governments along its western frontiers."
 unthinkable.502.a: "The sacrifices of the Soviet people will not be denied."

 unthinkable.51.t: "Potsdam: The German Question & The Oder-Neisse Line"
 unthinkable.51.d: "At the Cecilienhof table, Stalin presents the Soviet terms on Germany: formal international recognition of the Oder-Neisse boundary transferring Silesia and Pomerania to Poland, and ten billion dollars in industrial reparations, including deliveries from the British and American occupation zones."
 unthinkable.51.a: "Demand the Oder-Neisse border and full Western industrial reparations."
 unthinkable.51.b: "Propose a more moderate compromise to maintain Allied consensus."

 unthinkable.511.t: "Potsdam: Allied Response on Germany"
 unthinkable.511.d: "The Western delegations debate the Soviet ultimatum. Truman and Churchill (later Attlee) must decide whether to grant Poland administrative control of the Oder-Neisse lands and permit Soviet dismantling of industrial plants in Western Germany."
 unthinkable.511.a: "Accede to the Oder-Neisse administration in exchange for food supplies."
 unthinkable.511.b: "Reject the boundary! Freeze all industrial shipments to the Soviet zone!"

 unthinkable.52.t: "Potsdam: The Polish Question & The Trial of the Sixteen"
 unthinkable.52.d: "Tensions mount over the suppression of democratic leaders in Poland. Just weeks before the conference, Soviet authorities conducted the 'Trial of the Sixteen' in Moscow, convicting leaders of the Polish Secret State. The Western Allies demand immediate, unfettered democratic elections with international observers."
 unthinkable.52.a: "Insist on free democratic elections and the release of Polish patriots!"
 unthinkable.52.b: "Accept the Warsaw government as an unavoidable reality."

 unthinkable.521.t: "Potsdam: Stalin Confronted Over Poland"
 unthinkable.521.d: "The Western leaders forcefully confront Stalin regarding the Moscow trials and the suppression of the Polish underground. The atmosphere in the conference room turns frosty."
 unthinkable.521.a: "Offer reassuring promises of free elections while tightening party control."
 unthinkable.521.b: "Rebuff Western interference: Poland is vital to Soviet security!"

 unthinkable.53.t: "Potsdam: The Atomic Revelation"
 unthinkable.53.d: "During a break in proceedings on July 24, President Truman strolls over to Marshal Stalin. The successful Trinity nuclear test has fundamentally transformed the balance of power. Truman must decide whether to leverage this revelation."
 unthinkable.53.a: "Casually mention that the United States possesses a weapon of unusual destructive force."
 unthinkable.53.b: "Remain silent. Preserve complete tactical surprise."

 unthinkable.531.t: "Potsdam: Stalin Informed of the Super-Weapon"
 unthinkable.531.d: "President Truman quietly remarked that the United States has developed a new bomb of unprecedented destructive power. Stalin merely nodded and expressed hope that it would be put to good use against Japan. But immediately after returning to his quarters, Stalin summoned Beria: 'Accelerate Kurchatov's work! The Americans must not hold this over our heads!'"
 unthinkable.531.a: "Double all resources for the Soviet atomic bomb!"

 unthinkable.54.t: "Potsdam: The Final Declaration"
 unthinkable.54.d: "After two weeks of grueling negotiations, the Potsdam Conference draws to its conclusion. The world awaits the joint communique that will determine whether the victorious powers can preserve peace or whether Europe will plunge into division and renewed confrontation."
 unthinkable.54.a: "Sign the Potsdam Agreement — a fragile peace is preserved."
 unthinkable.54.b: "The Conference collapses into irreconcilable division!"

 unthinkable.55.t: "World News: Breakdown of the Potsdam Conference!"
 unthinkable.55.d: "Diplomatic disaster at Potsdam! The summit between the United States, Great Britain, and the Soviet Union has concluded in total failure. Amid bitter accusations over reparations, the Oder-Neisse border, and Eastern Europe, the leaders departed without a signed treaty. An Iron Curtain descends across Central Europe."
 unthinkable.55.a: "The Grand Alliance is broken."

 unthinkable.56.t: "World News: The Potsdam Agreement Signed"
 unthinkable.56.d: "The leaders of the United States, Great Britain, and the Soviet Union have concluded the Potsdam Conference with a signed joint agreement. Germany is to be demilitarized and democratized, Poland's western administration is temporarily recognized, and a Council of Foreign Ministers will draft final peace treaties."
 unthinkable.56.a: "Peace, for now."

 unthinkable.60.t: "The Trieste Standoff: Marshal Alexander's Report"
 unthinkable.60.d: "Field Marshal Alexander has reported a critical confrontation on the Adriatic. Marshal Josip Broz Tito's Yugoslav 4th Army entered Trieste and Gorizia ahead of the British 8th Army, hoisting Yugoslav flags and establishing 'People's Committees.' Alexander has drawn the 'Morgan Line' dividing the region into Allied Zone A and Yugoslav Zone B, and requests authorization to issue a military ultimatum."
 unthinkable.60.a: "Deliver an ultimatum: Tito must withdraw behind the Morgan Line!"
 unthinkable.60.b: "Compromise with Tito to avoid an armed conflagration."

 unthinkable.61.t: "Allied Ultimatum on the Morgan Line"
 unthinkable.61.d: "British General Morgan has delivered an ultimatum from the Supreme Allied Command to Marshal Tito. Yugoslav forces must withdraw from Trieste, Gorizia, and the Pola enclave within 48 hours, yielding control to Allied Military Government, or face immediate expulsion by Allied land, naval, and air forces."
 unthinkable.61.a: "Withdraw behind the Morgan Line. We cannot face Britain and America alone."
 unthinkable.61.b: "Trieste was won with partisan blood! Appeal to Comrade Stalin for protection!"

 unthinkable.611.t: "Tito Yields on the Morgan Line"
 unthinkable.611.d: "Marshal Tito has reluctantly agreed to withdraw Yugoslav military units east of the Morgan Line. British and New Zealand troops have entered Trieste to establish Allied Military Government in Zone A. A major crisis has been defused."
 unthinkable.611.a: "A victory for Allied firmness."

 unthinkable.62.t: "Tito Appeals to Stalin for Soviet Protection"
 unthinkable.62.d: "A frantic message arrives in Moscow from Belgrade. Tito reports that British and American divisions are threatening to attack Yugoslav positions in Trieste. Tito requests Red Army air cover and armored intervention to defend fraternal Yugoslav rights."
 unthinkable.62.a: "Rebuff Tito: We will not ignite World War III for Trieste!"
 unthinkable.62.b: "Pledge full Soviet military support: The Red Army stands with Yugoslavia!"

 unthinkable.63.t: "World News: War Erupts on the Adriatic!"
 unthinkable.63.d: "Shooting has broken out around Trieste and Gorizia! Western Allied forces have moved against Yugoslav positions following Tito's refusal to withdraw. With Soviet backing declared for Belgrade, artillery duels and air skirmishes threaten to engulf the entire Mediterranean in war."
 unthinkable.63.a: "The Adriatic is ablaze!"
 unthinkable.63.b: "Defend our comrades to the last!"

 unthinkable.64.t: "Moscow Abandons Belgrade: Tito Yields"
 unthinkable.64.d: "Stalin's reply to Belgrade was blunt: the Soviet Union will not go to war over Trieste. Bitter and isolated, Tito has been forced to order the Yugoslav 4th Army behind the Morgan Line. The betrayal will long fester in Belgrade."
 unthinkable.64.a: "We withdraw, but we will not forget."

 unthinkable.70.t: "Anders' Army: The Polish II Corps in the West"
 unthinkable.70.d: "General Władysław Anders commands over 110,000 Polish soldiers of the II Corps in Italy, with tens of thousands more in Britain. Staunchly anti-communist, these veteran troops categorically refuse to return to a Poland subjugated by Moscow, pleading with Allied command to launch an offensive to liberate their homeland."
 unthinkable.70.a: "Incorporate Anders' Corps into the Allied European vanguard!"
 unthinkable.70.b: "Keep them in holding camps to avoid provoking Moscow."

 unthinkable.71.t: "The Cursed Soldiers: Insurgency in Poland"
 unthinkable.71.d: "Behind Soviet frontlines in Poland, thousands of former Home Army partisans—now organized into Freedom and Independence (WiN) and National Armed Forces (NSZ)—wage a desperate guerilla war. NKVD command posts, supply trains, and communist officials face persistent ambushes in the forests."
 unthinkable.71.a: "Deploy internal security forces and NKVD regiments to crush the bandits!"
 unthinkable.71.b: "Announce limited amnesties to entice fighters out of the forests."

 unthinkable.80.t: "Churchill's Secret Army in Schleswig-Holstein"
 unthinkable.80.d: "Field Marshal Montgomery has preserved surrendered German formations of Army Group Northwest in Schleswig-Holstein with their uniforms and organization intact under General Busch. Winston Churchill contemplates ordering their re-equipment as 10 to 12 reconstituted Wehrmacht divisions to reinforce the Allied front."
 unthinkable.80.a: "Issue the order: Re-arm the German divisions!"
 unthinkable.80.b: "Cancel the plan. The political and moral cost is too immense."

 unthinkable.81.t: "Clash on the Demarcation Line: The Air Corridor Incident"
 unthinkable.81.d: "An alarming incident has occurred over the Helmstedt-Berlin air corridor. A Soviet Yak-9 fighter buzzed and fired warning bursts at an RAF transport aircraft, causing it to crash near Magdeburg. Frontline commanders report high alert across the demarcation line."
 unthinkable.81.a: "An unprovoked act of war! Launch Operation Unthinkable!"
 unthinkable.81.b: "Lodge a severe protest and defuse the situation."

 unthinkable.85.t: "Zhukov's Counter-Offensive: Plan Groza-2"
 unthinkable.85.d: "The Western Allies have crossed the demarcation line! In Moscow and Berlin, Marshal Georgy Zhukov immediately activates the Red Army's contingency counter-offensive: 'Groza-2' (Red Thunder). Millions of battle-hardened soldiers, massed Katyusha batteries, and heavy tank armies surge westward toward the Rhine and the English Channel."
 unthinkable.85.a: "Death to the imperialist invaders! On to the Channel!"

 unthinkable.90.t: "The Atomic Ultimatum Delivered to the Kremlin"
 unthinkable.90.d: "The United States and Great Britain have delivered an ultimatum of historic gravity to Moscow. Citing the successful Trinity nuclear test, the Western Allies demand the withdrawal of Red Army forces from Poland, the Baltic states, and Central Europe, threatening total atomic destruction of Soviet military centers if their terms are refused."
 unthinkable.90.a: "Defiant rejection! The Red Army fears no atomic blackmail!"
 unthinkable.90.b: "Offer diplomatic concessions on Poland to avert nuclear catastrophe."

 unthinkable.91.t: "Stalin's Defiance to the Atomic Ultimatum"
 unthinkable.91.d: "Soviet Foreign Minister Molotov has formally returned Moscow's reply: 'The Soviet people will never yield to atomic blackmail.' Stalin has ordered all frontline divisions to combat readiness. The Western powers must choose whether to execute their threat."
 unthinkable.91.a: "Then war it is. Execute Operation Unthinkable!"
 unthinkable.91.b: "The price of atomic war is too terrible. Stand down."

 unthinkable.92.t: "President Truman: Tactical Atomic Warfare in Europe?"
 unthinkable.92.d: "With war erupting against the Soviet Union across Central Europe, the US military leadership requests authorization to deploy atomic weapons against massed Red Army staging areas, bridges over the Oder, and rail bottlenecks in eastern Germany."
 unthinkable.92.a: "Authorize tactical atomic strikes on Soviet marshaling areas!"
 unthinkable.92.b: "Forbid atomic strikes in Europe; reserve all bombs for Japan."

 unthinkable.100.t: "Operation Unthinkable Begins!"
 unthinkable.100.d: "Barely weeks after the fall of Berlin, artillery once again thunders across Central Europe. Western Allied armored columns have crossed the demarcation line in Germany, launching a massive offensive against Red Army positions in an operation code-named 'Unthinkable.' A third global conflict for the fate of Europe has begun."
 unthinkable.100.a: "The world holds its breath..."
 unthinkable.100.b: "To arms! Defend the Motherland!"

 # BRITISH FOCUS TREE LOCALISATION
 ENG_cost_of_victory: "The Cost of Victory"
 ENG_cost_of_victory_desc: "The British Empire stands victorious across three continents, but at ruinous financial and material cost. We must rebuild our national wealth."
 ENG_food_and_bread_rationing: "Austerity & Bread Rationing"
 ENG_food_and_bread_rationing_desc: "To prevent famine in liberated Europe and maintain fiscal solvency, strict domestic rationing must remain in place."
 ENG_rebuild_the_blitzed_cities: "Rebuild Blitzed Cities"
 ENG_rebuild_the_blitzed_cities_desc: "Reconstruct the ruined residential and industrial areas of London, Coventry, and Birmingham."
 ENG_nationalize_coal_and_rail: "Nationalize Coal & Rail"
 ENG_nationalize_coal_and_rail_desc: "Bring vital energy extraction and the railway network under public ownership to lower industrial freight costs."
 ENG_export_drive_campaign: "The Export Drive"
 ENG_export_drive_campaign_desc: "'Export or Die!' Re-orient British manufacturing toward overseas export markets to rebuild dollar reserves."
 ENG_welfare_state_foundations: "Foundations of the Welfare State"
 ENG_welfare_state_foundations_desc: "Fulfill the promise of the Beveridge Report to banish want, squalor, and disease from British society."
 ENG_clyde_and_tyne_shipyards: "Clyde & Tyne Modernization"
 ENG_clyde_and_tyne_shipyards_desc: "Modernize the historic shipyards of Glasgow, Newcastle, and Belfast for both commercial trade and naval power."
 ENG_anglo_american_financial_bridge: "Anglo-American Financial Bridge"
 ENG_anglo_american_financial_bridge_desc: "Secure crucial low-interest loans from Washington to stabilize sterling and fund national reconstruction."
 ENG_economic_solvency_restored: "Imperial Solvency Restored"
 ENG_economic_solvency_restored_desc: "Through endurance and industrial discipline, the British economy emerges resilient and self-sustaining."

 ENG_the_imperial_crossroads: "The Imperial Crossroads"
 ENG_the_imperial_crossroads_desc: "Chart a modern course for the British Empire and Commonwealth in the post-war world."
 ENG_indian_question_mountbatten: "The Indian Question"
 ENG_indian_question_mountbatten_desc: "Address the irrepressible demands for Indian independence, balancing the Congress and the Muslim League."
 ENG_palestine_mandate_crisis: "The Palestine Dilemma"
 ENG_palestine_mandate_crisis_desc: "Navigate the perilous conflict between Jewish immigration and Arab national rights in our mandate territory."
 ENG_suez_and_middle_east_oil: "Fortify the Suez Lifeline"
 ENG_suez_and_middle_east_oil_desc: "Reinforce garrisons along the Suez Canal and safeguard oil concessions in the Persian Gulf."
 ENG_colonial_development_act: "Colonial Development Program"
 ENG_colonial_development_act_desc: "Invest in infrastructure, agriculture, and education across our African and Caribbean colonies."
 ENG_dominion_defense_cooperation: "Commonwealth Defense Council"
 ENG_dominion_defense_cooperation_desc: "Deepen strategic military ties with Canada, Australia, New Zealand, and South Africa."

 ENG_reorganize_armed_forces: "Imperial Defense Reorganization"
 ENG_reorganize_armed_forces_desc: "Streamline the British Army under Field Marshal Montgomery into a lean, highly mechanized continental force."
 ENG_centurion_and_comet_armor: "Centurion & Comet Armor"
 ENG_centurion_and_comet_armor_desc: "Deploy the revolutionary Centurion Universal Tank to replace wartime cruisers and infantry tanks."
 ENG_raf_jet_aviation_meteor: "Gloster Meteor Jet Wings"
 ENG_raf_jet_aviation_meteor_desc: "Equip frontline squadrons with combat-proven Gloster Meteor jet fighters."
 ENG_heavy_bomber_modernization: "Lincoln & Mosquito Modernization"
 ENG_heavy_bomber_modernization_desc: "Upgrade Bomber Command with long-range Avro Lincoln bombers and Mosquito pathfinders."
 ENG_de_havilland_vampire_fighter: "de Havilland Vampire Jet"
 ENG_de_havilland_vampire_fighter_desc: "Introduce the twin-boom Vampire jet interceptor into RAF service."
 ENG_commission_hms_vanguard: "Commission HMS Vanguard"
 ENG_commission_hms_vanguard_desc: "Complete the largest, fastest, and last battleship ever built for the Royal Navy."
 ENG_centimetric_radar_and_ew: "Centimetric Radar & EW"
 ENG_centimetric_radar_and_ew_desc: "Maintain our global lead in cavity magnetron radar and electronic counter-measures."

 ENG_unthinkable_planning_report: "Operation Unthinkable War Plans"
 ENG_unthinkable_planning_report_desc: "Commission the Armed Forces Joint Planning Staff to prepare contingencies for an offensive against the USSR."
 ENG_british_election_1945: "The July 1945 General Election"
 ENG_british_election_1945_desc: "The nation goes to the polls to decide between Churchill's wartime prestige and Attlee's vision of social reform."
 ENG_coordinate_with_truman: "Approach President Truman"
 ENG_coordinate_with_truman_desc: "Urge Washington to recognize the acute Soviet threat in Central Europe and coordinate joint plans."
 ENG_rearm_wehrmacht_schleswig: "Re-equip Wehrmacht Formations"
 ENG_rearm_wehrmacht_schleswig_desc: "Re-arm 10 to 12 surrendered German divisions in Schleswig-Holstein to bolster the Allied battle line."
 ENG_rally_polish_forces_anders: "Mobilize Anders' Polish Veterans"
 ENG_rally_polish_forces_anders_desc: "Integrate General Anders' 220,000 Polish soldiers into the spearhead of the liberation force."
 ENG_potsdam_ultimatum_to_stalin: "Deliver the Potsdam Ultimatum"
 ENG_potsdam_ultimatum_to_stalin_desc: "Demand that the Soviet Union immediately withdraw from Poland and guarantee free elections."
 ENG_launch_operation_unthinkable: "Commence Operation Unthinkable"
 ENG_launch_operation_unthinkable_desc: "Order Allied armored columns across the Elbe to smash Soviet lines and liberate Eastern Europe."

 # AMERICAN FOCUS TREE LOCALISATION
 USA_postwar_transition: "Post-War Reconversion"
 USA_postwar_transition_desc: "Direct America's colossal industrial machine from total war to domestic prosperity and consumer leadership."
 USA_gi_bill_of_rights: "The GI Bill of Rights"
 USA_gi_bill_of_rights_desc: "Provide low-cost mortgages, tuition support, and unemployment compensation to millions of returning servicemen."
 USA_industrial_reconversion: "Industrial Plant Reconversion"
 USA_industrial_reconversion_desc: "Convert aircraft and tank plants back into automobile factories, home appliances, and commercial goods."
 USA_curb_postwar_strikes: "Mediate Labor Disputes"
 USA_curb_postwar_strikes_desc: "Resolve widespread strikes in coal, steel, and transportation to guarantee uninterrupted production."
 USA_arsenal_of_peace: "Arsenal of Peace"
 USA_arsenal_of_peace_desc: "America's unmatched economic strength guarantees the highest standard of living in human history."

 USA_pacific_crossroads: "The Pacific Dilemma"
 USA_pacific_crossroads_desc: "Imperial Japan fights on with fanatical devotion. We must allocate immense resources to complete their defeat."
 USA_operation_olympic_preparations: "Prepare Operation Olympic"
 USA_operation_olympic_preparations_desc: "Organize amphibious landings on the southern Japanese home island of Kyushu for November 1945."
 USA_pacific_fleet_supremacy: "Pacific Carrier Supremacy"
 USA_pacific_fleet_supremacy_desc: "Maintain dozens of Essex-class fleet carriers to blockade and bombard the Japanese mainland."
 USA_operation_coronet_preparations: "Prepare Operation Coronet"
 USA_operation_coronet_preparations_desc: "Plan the decisive armored assault on the Kanto Plain and Tokyo scheduled for March 1946."

 USA_manhattan_culmination: "Manhattan Project Culmination"
 USA_manhattan_culmination_desc: "Bring years of top-secret nuclear research at Los Alamos and Oak Ridge to its explosive conclusion."
 USA_trinity_test_alamogordo: "The Trinity Test"
 USA_trinity_test_alamogordo_desc: "Detonate the world's first atomic bomb in the New Mexico desert to prove plutonium implosion technology."
 USA_atomic_monopoly_diplomacy: "Atomic Diplomacy"
 USA_atomic_monopoly_diplomacy_desc: "Leverage America's exclusive possession of the nuclear bomb to deter Soviet expansionism globally."
 USA_deploy_b29_superfortress_europe: "Deploy B-29s to Europe"
 USA_deploy_b29_superfortress_europe_desc: "Station Boeing B-29 Superfortress wings on European bases capable of reaching Moscow and Baku."

 USA_halt_demobilization_europe: "Halt European Demobilization"
 USA_halt_demobilization_europe_desc: "Freeze troop redeployments from Germany until the crisis with the Soviet Union is settled."
 USA_mass_produce_m26_pershing: "M26 Pershing Deployment"
 USA_mass_produce_m26_pershing_desc: "Issue 90mm-armed M26 Pershing heavy tanks to frontline armored divisions in Germany."
 USA_jet_fighter_lockheed_p80: "Lockheed P-80 Shooting Star"
 USA_jet_fighter_lockheed_p80_desc: "Speed mass production of America's first operational turbojet fighter."
 USA_lend_lease_leverage_threat: "Lend-Lease Ultimatum"
 USA_lend_lease_leverage_threat_desc: "Threaten the immediate and permanent cutoff of trucks, trains, and fuel to the USSR."
 USA_endorse_operation_unthinkable: "Endorse Operation Unthinkable"
 USA_endorse_operation_unthinkable_desc: "Commit American ground armies and strategic air forces to Churchill's offensive against the Red Army."

 # SOVIET FOCUS TREE LOCALISATION
 SOV_fourth_five_year_plan: "The Fourth Five-Year Plan"
 SOV_fourth_five_year_plan_desc: "Rehabilitate the devastated regions of our country and exceed the pre-war industrial benchmarks."
 SOV_reparations_and_dismantling: "Trophy Machinery Reparations"
 SOV_reparations_and_dismantling_desc: "Dismantle precision factories and rolling stock in our German zone and transport them to the Soviet motherland."
 SOV_tankograd_and_uralvagonzavod: "Ural Industrial Titan"
 SOV_tankograd_and_uralvagonzavod_desc: "Sustain mass production of heavy armor at Tankograd in Chelyabinsk and Nizhny Tagil."
 SOV_rebuild_donbas_and_dnieper: "Rebuild Donbas & DneproGES"
 SOV_rebuild_donbas_and_dnieper_desc: "Pump flooded coal mines and reconstruct the gigantic hydroelectric dam on the Dnieper."
 SOV_soviet_industrial_might: "Triumph of Soviet Industry"
 SOV_soviet_industrial_might_desc: "From the ashes of war, our socialist economy stands stronger, larger, and more self-reliant than ever."

 SOV_smersh_and_nkvd_vigilance: "SMERSH & NKVD Vigilance"
 SOV_smersh_and_nkvd_vigilance_desc: "Unmask counter-revolutionary conspirators, saboteurs, and foreign spies in the liberated territories."
 SOV_crush_anti_soviet_partisans: "Eliminate Fascist Partisans"
 SOV_crush_anti_soviet_partisans_desc: "Crush armed rebel gangs in Western Ukraine, the Baltic forests, and Eastern Poland."
 SOV_iron_curtain_consolidation: "Consolidate the Eastern Bloc"
 SOV_iron_curtain_consolidation_desc: "Cement fraternal alliances with popular democratic governments in Poland, Romania, Bulgaria, and Hungary."

 SOV_lessons_of_great_patriotic_war: "Lessons of the Great Patriotic War"
 SOV_lessons_of_great_patriotic_war_desc: "Codify the operational art of deep battle proven by Marshals Zhukov, Konev, and Rokossovsky."
 SOV_mass_produce_is3_heavy_tanks: "Mass Produce IS-3 Heavy Tanks"
 SOV_mass_produce_is3_heavy_tanks_desc: "Equip guards tank armies with the revolutionary pike-nosed IS-3 heavy tank."
 SOV_kalashnikov_infantry_rifle: "Kalashnikov Assault Weaponry"
 SOV_kalashnikov_infantry_rifle_desc: "Adopt modern intermediate-cartridge automatic rifles designed by sergeant Mikhail Kalashnikov."
 SOV_soviet_atomic_bomb_project: "Soviet Atomic Bomb Project"
 SOV_soviet_atomic_bomb_project_desc: "Mobilize physics laboratories under Igor Kurchatov to break the American atomic monopoly."
 SOV_tupolev_tu4_strategic_bomber: "Tupolev Tu-4 Strategic Bomber"
 SOV_tupolev_tu4_strategic_bomber_desc: "Reverse-engineer interned American B-29s to build our first long-range nuclear delivery aircraft."

 SOV_western_imperialist_threat: "The Anglo-American Threat"
 SOV_western_imperialist_threat_desc: "Imperialist reactionaries in London and Washington are plotting to undo our historic victory."
 SOV_manchurian_offensive_august_storm: "Operation August Storm"
 SOV_manchurian_offensive_august_storm_desc: "Launch a thunderous multi-front offensive into Manchuria to pulverize the Japanese Kwantung Army."
 SOV_strengthen_order_of_battle_germany: "Reinforce Forward Armies in Germany"
 SOV_strengthen_order_of_battle_germany_desc: "Concentrate overwhelming armored reserves along the demarcation line on the Elbe."
 SOV_operation_storm_preemptive_strike: "Operation Storm: Preemptive Strike"
 SOV_operation_storm_preemptive_strike_desc: "Strike first! Send hundreds of Soviet armored divisions rolling across Germany to the English Channel!"

 # POLISH FOCUS TREE LOCALISATION
 POL_rebuild_from_ashes: "Rebuild from the Ashes"
 POL_rebuild_from_ashes_desc: "Pick up the pieces of our shattered homeland and rally the Polish people for national revival."
 POL_rebuild_warsaw_brick_by_brick: "Reconstruct Warsaw Brick by Brick"
 POL_rebuild_warsaw_brick_by_brick_desc: "Clear millions of tons of rubble and reconstruct our historic capital from drawings and photographs."
 POL_settle_recovered_territories: "Settle the Recovered Territories"
 POL_settle_recovered_territories_desc: "Resettle millions of Polish families in the newly acquired lands of Silesia, Pomerania, and Warmia."
 POL_reconstruct_silesian_coal_basin: "Silesian Heavy Industry"
 POL_reconstruct_silesian_coal_basin_desc: "Re-ignite the coal mines, blast furnaces, and metal works of Upper and Lower Silesia."
 POL_reopen_baltic_ports_gdansk: "Revitalize Baltic Sea Harbors"
 POL_reopen_baltic_ports_gdansk_desc: "Rebuild the port facilities in Gdansk, Gdynia, and Szczecin to anchor Polish maritime trade."

 POL_cooperate_with_red_army: "Fraternal Alliance with the USSR"
 POL_cooperate_with_red_army_desc: "Embrace the Provisional Government in Warsaw and secure Moscow's guarantee of our western borders."
 POL_purge_london_reactionaries: "Suppress Western Reactionaries"
 POL_purge_london_reactionaries_desc: "Arrest agents of the London government-in-exile and consolidate socialist administration."
 POL_peoples_army_rearmament: "Modernize the Polish People's Army"
 POL_peoples_army_rearmament_desc: "Equip the Wojsko Polskie with modern Soviet weaponry and tactical training."
 POL_integrate_with_comintern: "Join the Warsaw Bloc"
 POL_integrate_with_comintern_desc: "Firmly align Poland's international destiny with the Soviet Union and its socialist allies."

 POL_contact_anders_and_london: "Rally Around Anders and London"
 POL_contact_anders_and_london_desc: "Reject the puppet committee in Warsaw and re-affirm loyalty to the legitimate Polish Government-in-Exile."
 POL_coordinate_with_win_underground: "Coordinate with WiN Underground"
 POL_coordinate_with_win_underground_desc: "Establish radio links with the armed partisans of Freedom and Independence fighting behind Soviet lines."
 POL_rally_free_polish_divisions: "Mobilize Free Polish Formations"
 POL_rally_free_polish_divisions_desc: "Arm thousands of Polish veterans in Italy and Germany under General Wladyslaw Anders."
 POL_rise_up_and_join_unthinkable: "Rise Up for Polish Liberty"
 POL_rise_up_and_join_unthinkable_desc: "Ignite nationwide uprisings in the rear of the Red Army and fight side-by-side with Western forces."

 # GERMAN FOCUS TREE LOCALISATION
 GER_stunde_null: "Stunde Null (Zero Hour)"
 GER_stunde_null_desc: "The Third Reich has collapsed in total ruins. Our people must clear the rubble and rebuild from ground zero."
 GER_rubble_clearing_and_rebuilding: "Trummerfrauen & Reconstruction"
 GER_rubble_clearing_and_rebuilding_desc: "Mobilize citizens to clear shattered cities, restore clean water, and build makeshift shelters."
 GER_denazification_and_trials: "Denazification & Rule of Law"
 GER_denazification_and_trials_desc: "Purge the remnants of the Nazi party and establish democratic municipal administrations."
 GER_rebuild_the_ruhr_factories: "Rebuild the Ruhr Arsenal"
 GER_rebuild_the_ruhr_factories_desc: "Restart heavy foundries and machine tooling plants in the industrial basin of the Ruhr."
 GER_rearm_under_allied_command: "Reconstitute Wehrmacht Formations"
 GER_rearm_under_allied_command_desc: "Re-arm surrendered veteran divisions under Allied supervision to defend Central Europe against Bolshevism."
 GER_proclaim_bundesrepublik: "Proclaim the Federal Republic"
 GER_proclaim_bundesrepublik_desc: "Establish a democratic, constitutional German republic firmly anchored in the Western community of nations."

 # GERMAN ASSETS EXPLOITATION & SCIENTIFIC INTELLIGENCE
 ENG_recruit_wehrmacht_commanders: "Debrief Wehrmacht Commanders"
 ENG_recruit_wehrmacht_commanders_desc: "Interrogate and consult veteran German field marshals and tank tacticians to design counter-measures against Soviet armored doctrine."
 ENG_exploit_captured_panthers: "Examine Captured Panzers"
 ENG_exploit_captured_panthers_desc: "Inspect and test captured Panther and Tiger tanks, incorporating superior German optics and ballistic design into Allied armor programs."

 USA_operation_paperclip: "Operation Paperclip"
 USA_operation_paperclip_desc: "Evacuate top German aeronautical and rocket specialists, including Wernher von Braun, to bolster American guided missile and aerospace development."
 USA_alsos_mission_trophy_tech: "The Alsos Mission and High-Tech Loot"
 USA_alsos_mission_trophy_tech_desc: "Secure German nuclear research files from Haigerloch and capture advanced Walter turbine and Type XXI U-boat plans."
 USA_german_tactical_debriefings: "General Halder's Tactical Analysis"
 USA_german_tactical_debriefings_desc: "Direct General Franz Halder and the German Military History Division to compile detailed operational assessments of Red Army combat methods."

 SOV_trophy_panzer_and_u_boats: "Trophy Panzers and Baltic Fleets"
 SOV_trophy_panzer_and_u_boats_desc: "Incorporate captured German Panther tanks into specialized Red Army trophy units and dismantle captured Type XXI submarines for naval research."
 SOV_operation_osoaviakhim: "Operation Osoaviakhim"
 SOV_operation_osoaviakhim_desc: "Mobilize thousands of German rocket, aviation, and small arms specialists to work in Soviet institutes in Podlipki, Khimki, and Izhevsk."
 SOV_free_germany_committee_officers: "Free Germany Committee Cadres"
 SOV_free_germany_committee_officers_desc: "Deploy Field Marshal Paulus and General von Seydlitz to appeal to German POWs and establish loyal paramilitary security units in the East."

 FRA_recruit_german_technicians: "Employ German Engineers and Panzers"
 FRA_recruit_german_technicians_desc: "Contract BMW and Maybach turbine and engine specialists for the Snecma and AMX programs, and equip French cavalry units with captured Panthers."

 unthinkable_german_command_advisors: "German Staff Advisors"
 unthinkable_german_command_advisors_desc: "Surrendered Wehrmacht officers advise Allied commanders on Soviet tactical habits, logistics, and counter-offensive patterns."
 unthinkable_tactical_evaluation: "Eastern Front Tactical Debriefs"
 unthinkable_tactical_evaluation_desc: "In-depth intelligence debriefings provide valuable lessons on fighting the massed artillery and tank waves of the Red Army."
 unthinkable_free_germany_committee: "Free Germany Committee Support"
 unthinkable_free_germany_committee_desc: "The League of German Officers assists Soviet intelligence and demoralizes anti-Soviet resistance across the demarcation line."

 # =========================================================================
 # POST-WAR TECHNOLOGIES (1944 - 1952)
 # =========================================================================

 # HELICOPTERS
 early_helicopters: "Early Helicopters"
 early_helicopters_desc: "Light rotary-wing aircraft such as the Sikorsky R-4 and Flettner Fl 282, providing unmatched vertical takeoff and low-speed aerial observation capabilities."
 unthinkable_helicopter_recon_tech: "Helicopter Reconnaissance Wings"
 unthinkable_helicopter_recon_tech_desc: "Equip army divisions with scout helicopters to spot enemy armor concentrations, direct artillery, and eliminate terrain penalties."
 unthinkable_helicopter_medevac_tech: "Aeromedical Evacuation & MASH"
 unthinkable_helicopter_medevac_tech_desc: "Deploy dedicated medical evacuation helicopters to airlift wounded soldiers directly from the front line to surgical hospitals, saving thousands of veteran lives."
 unthinkable_helicopter_logistics_tech: "Helicopter Cargo & Tactical Airlift"
 unthinkable_helicopter_logistics_tech_desc: "Rotary-wing transport squadrons capable of delivering ammunition, rations, and fuel directly to isolated and encircled combat units without runways."

 # INDUSTRY & AUTOMATION
 postwar_prefab_construction: "Prefabricated Modular Construction"
 postwar_prefab_construction_desc: "Standardized concrete prefabrication techniques to rebuild bombed infrastructure, expand machine depots, and accelerate post-war civil reconstruction."
 automation_transfer_machines: "Detroit Automation & Transfer Machines"
 automation_transfer_machines_desc: "Automated multi-station machining tools that dramatically increase factory throughput and minimize efficiency losses when retooling equipment lines."
 high_temp_aerospace_alloys: "High-Temperature Aerospace Metallurgy"
 high_temp_aerospace_alloys_desc: "Nimonic alloys, titanium machining, and heat-resistant turbine blades essential for mass-producing reliable jet engines and heavy armor plate."
 advanced_synthetic_kerosene: "Catalytic Reforming & JP-4 Jet Fuel"
 advanced_synthetic_kerosene_desc: "Modern chemical cracking and synthetic kerosene processing, maximizing fuel extraction and keeping thousands of jet turbines aloft."
 commercial_nuclear_power: "Commercial Nuclear Energy"
 commercial_nuclear_power_desc: "Harnessing controlled nuclear fission for electrical grid supply, relieving the burden on coal mines and powering heavy industry."

 # NUCLEAR RESEARCH
 levitated_core_implosion: "Levitated-Core Implosion Physics"
 levitated_core_implosion_desc: "Suspended pit designs and composite uranium-plutonium cores that dramatically improve explosive compression and fissile yield while conserving scarce isotopes."
 industrial_breeding_reactors: "Industrial Plutonium Production Piles"
 industrial_breeding_reactors_desc: "Massive heavy-water and graphite-moderated reactor complexes dedicated to continuous plutonium breeding and accelerated warhead assembly."
 tactical_nuclear_warheads: "Tactical Nuclear Miniaturization"
 tactical_nuclear_warheads_desc: "Compact atomic warhead packages enabling nuclear gravity bombs for strike fighters and specialized atomic artillery projectiles."
 unthinkable_thermonuclear_foundations: "Thermonuclear Fusion Research"
 unthinkable_thermonuclear_foundations_desc: "Theoretical foundations and high-temperature computational studies of radiation implosion and thermonuclear fusion, paving the way for multi-megaton weaponry."

 # ELECTRONICS & COMPUTING
 proximity_vt_fuzes: "Proximity VT Fuzes"
 proximity_vt_fuzes_desc: "Miniaturized radar transmitters in artillery and anti-air shells that detonate precisely above entrenched infantry and adjacent to incoming bombers."
 electronic_computing_machines: "First-Generation Electronic Computers"
 electronic_computing_machines_desc: "Massive vacuum-tube mainframes such as ENIAC and Colossus that automate cryptographic decryption, ballistic tables, and scientific simulation."
 transistor_technology: "The Solid-State Transistor"
 transistor_technology_desc: "Revolutionary semiconductor triodes replacing fragile vacuum tubes, enabling ruggedized tactical radios and reliable combat electronics."
 early_warning_radar_networks: "Early Warning Radar Networks"
 early_warning_radar_networks_desc: "Cavity-magnetron radar chains with integrated ground-control interception, tracking hostile strike formations hundreds of miles away."
 active_night_vision: "Active Infrared Night Vision"
 active_night_vision_desc: "Infrared searchlights and detector scopes mounted on tanks and sniper rifles, turning night-time darkness into a lethal hunting ground."
 airborne_interception_radar: "Airborne Interception Radar"
 airborne_interception_radar_desc: "Compact centimetric radar systems integrated into nose radomes, allowing all-weather and night jet fighters to detect and lock onto hostile aircraft in zero visibility."
 radar_ranging_gunsights: "Radar-Ranging Gyro Gunsights"
 radar_ranging_gunsights_desc: "Gyroscopic optical gunsights coupled directly with small nose-mounted ranging radars to automatically compute lead angles during high-speed transonic dogfights."
 instrument_flight_and_tacan: "Instrument Flight & Tactical Navigation"
 instrument_flight_and_tacan_desc: "Standardized tactical air navigation beacons, radio altimeters, and automatic flight directors, allowing continuous combat sorties through adverse European weather."

 # ARTILLERY & MISSILES
 postwar_heavy_howitzers: "Modern Heavy Field Howitzers"
 postwar_heavy_howitzers_desc: "Long-range 152mm and 155mm howitzers utilizing streamlined ballistic shells to pulverize enemy defensive strongpoints deep behind the front."
 infantry_recoilless_rifles: "Man-Portable Recoilless Rifles"
 infantry_recoilless_rifles_desc: "Lightweight counter-mass guns giving infantry squads and paratroopers the immediate firepower to shatter enemy pillboxes and armor."
 postwar_heavy_mrls: "Heavy Multiple Rocket Launchers"
 postwar_heavy_mrls_desc: "Large-caliber salvos like the BM-24 capable of saturating dozens of square kilometers with thermobaric and high-explosive warheads."
 radar_directed_anti_air: "Radar-Directed Heavy Anti-Air"
 radar_directed_anti_air_desc: "Automated fire-control radars linked directly to rapid-fire anti-aircraft guns, tracking high-speed targets through heavy cloud cover."
 surface_to_air_missiles_1: "Guided Surface-to-Air Missiles"
 surface_to_air_missiles_1_desc: "First-generation supersonic SAM systems like Nike Ajax and S-25 Berkut, defending national airspace against strategic atomic bombers."

 # NAVAL
 postwar_fast_attack_submarine: "High-Speed Diesel-Electric Submarines"
 postwar_fast_attack_submarine_desc: "Hydrodynamic hulls, high-capacity battery banks, and deep-submergence snorkels derived from Type XXI designs to outrun surface escorts."
 asw_sonobuoys_and_helicopters: "Airborne ASW & Dipping Sonars"
 asw_sonobuoys_and_helicopters_desc: "Specialized naval helicopters equipped with dip sonars and sonobuoy dispensers, forming an impenetrable barrier against hostile wolfpacks."
 angled_flight_deck_carriers: "Angled Flight Deck & Steam Catapults"
 angled_flight_deck_carriers_desc: "British-pioneered angled decks and steam catapults permitting simultaneous high-speed launch and recovery of heavy jet aircraft."
 early_guided_missile_cruiser: "Guided Missile Fleet Cruisers"
 early_guided_missile_cruiser_desc: "Re-arming heavy surface cruisers with surface-to-air Terrier missiles and antiship cruise missiles to dominate oceanic battlefields."

 # HELICOPTERS
 postwar_turboshaft_helicopters: "Turboshaft Utility Helicopters"
 postwar_turboshaft_helicopters_desc: "Replacing heavy piston engines with lightweight turboshaft gas turbines, substantially boosting payload capacity, speed, and high-altitude mountain hover performance."
 heavy_cargo_and_attack_helicopters: "Heavy Transport & Armed Gunship Helicopters"
 heavy_cargo_and_attack_helicopters_desc: "Dedicated heavy-lift cargo airframes and armed escort gunships capable of slinging artillery batteries, evacuating entire trauma wards, and strafing enemy troop concentrations."

 # INFANTRY
 assault_rifle_standardization: "Standardized Selective-Fire Assault Rifles"
 assault_rifle_standardization_desc: "Equipping all frontline riflemen with intermediate-cartridge assault rifles like the AK-47 and FN FAL, dramatically multiplying squad firepower."
 postwar_infantry_at_weapons: "Advanced Shaped-Charge Anti-Tank Weapons"
 postwar_infantry_at_weapons_desc: "Next-generation man-portable rockets such as the RPG-2 and M20 Super Bazooka, capable of piercing the thickest frontal tank armor."

 # ARMOR
 main_battle_tank_generation_1: "First-Generation Main Battle Tank"
 main_battle_tank_generation_1_desc: "Merging the protection of heavy tanks with the mobility of mediums, armed with devastating 100mm and 20-pounder rifled cannons (T-54, Centurion, M46)."
 postwar_apc_mechanization: "Full-Tracked & Wheeled APC Mechanization"
 postwar_apc_mechanization_desc: "Armored personnel carriers like the BTR-152 and M75, shielding infantry from artillery shrapnel and moving seamlessly alongside armor columns."
 main_battle_tank_generation_2: "Second-Generation MBT & Gun Stabilizers"
 main_battle_tank_generation_2_desc: "Two-axis gyroscopic gun stabilization and NBC protective overpressure systems, enabling accurate firing on the move across contaminated battlefields."

 # AIR
 axial_flow_turbojets: "Axial-Flow Turbojets"
 axial_flow_turbojets_desc: "Multi-stage axial compressors offering superior compression ratios, slim nacelle profiles, and reduced aerodynamic drag compared to early centrifugal designs."
 swept_wing_jet_fighters: "Swept-Wing Transonic Jet Fighters"
 swept_wing_jet_fighters_desc: "Aerodynamic swept wings and centrifugal turbojets (MiG-15, F-86 Sabre, Ouragan) giving pilots mastery of near-sonic speeds."
 jet_strike_tactics: "Jet Fighter-Bomber Integration"
 jet_strike_tactics_desc: "Heavy ordnance pylons, unguided rocket pods, and high-speed ground strike tactics adapted for frontline turbojet airframes to shatter massed armored thrusts."
 early_afterburner_reheat: "Jet Reheat & Early Afterburners"
 early_afterburner_reheat_desc: "Fuel injection into the turbine exhaust stream yielding massive bursts of supplemental thrust for rapid scrambles and interception of high-altitude bombers."
 postwar_jet_bombers: "High-Altitude Jet Strategic Bombers"
 postwar_jet_bombers_desc: "Fast swept-wing jet bombers (Canberra, Il-28, B-47) flying above conventional piston interceptors to deliver tactical and strategic payloads."
 afterburner_transonic_flight: "Afterburning Turbojets & Transonic Dynamics"
 afterburner_transonic_flight_desc: "Exhaust reheating afterburners and all-flying tailplanes, breaking the sound barrier in shallow dives and supercharging interception climbs."

 # NATO & WARSAW PACT & GERMAN REUNIFICATION
 ENG_found_north_atlantic_treaty: "Ratify the North Atlantic Treaty"
 ENG_found_north_atlantic_treaty_desc: "Transform the wartime Allied coalition into a permanent mutual defense pact: the North Atlantic Treaty Organization (NATO)."

 SOV_establish_german_democratic_republic: "Proclaim the German Democratic Republic"
 SOV_establish_german_democratic_republic_desc: "Establish the socialist German Democratic Republic (DDR) in the Soviet occupation zone under Wilhelm Pieck and Walter Ulbricht."

 GER_bizonia_economic_merger: "Establish Bizonia"
 GER_bizonia_economic_merger_desc: "Merge the British and American occupation zones into an integrated economic area, removing trade barriers across northwestern Germany."
 GER_currency_reform_deutsche_mark: "Ludwig Erhard's Currency Reform"
 GER_currency_reform_deutsche_mark_desc: "Replace the worthless Reichsmark with the stable Deutsche Mark, abolishing the black market and revitalizing West German commerce."
 GER_trizonia_integration: "Integrate Trizonia"
 GER_trizonia_integration_desc: "Incorporate the French occupation zone in the Rhineland, Baden, and Wurttemberg, unifying the entire Western German economic basin."
 GER_free_democratic_parties: "Foundation of Democratic Parties"
 GER_free_democratic_parties_desc: "Authorize the foundation of democratic political parties across the Western zones, including Konrad Adenauer's CDU and Kurt Schumacher's SPD."
 GER_basic_law_grundgesetz: "Draft the Basic Law (Grundgesetz)"
 GER_basic_law_grundgesetz_desc: "Convene the Parliamentary Council in Bonn to draft the Basic Law, establishing a constitutional, democratic federation."
 GER_found_the_bundeswehr: "The Blank Agency & Bundeswehr"
 GER_found_the_bundeswehr_desc: "Establish Theodor Blank's security agency to lay the institutional foundation for the federal armed forces (Bundeswehr)."

 ENG_extra_research_slot_postwar: "Post-War Scientific Expansion"
 ENG_extra_research_slot_postwar_desc: "Mobilize Britain's premier universities, laboratories, and wartime research institutes to guarantee our long-term technological pre-eminence."
 ENG_tube_alloys_legacy: "Tube Alloys Legacy"
 ENG_tube_alloys_legacy_desc: "British scientists laid the theoretical foundation of atomic fission in the Tube Alloys project. We must reclaim our sovereign atomic destiny."
 ENG_british_atomic_bomb: "British Atomic Deterrent"
 ENG_british_atomic_bomb_desc: "Construct the Harwell research pile and Windscale reactors to forge an independent British nuclear arsenal."
 USA_scientific_research_act: "National Science Foundation Act"
 USA_scientific_research_act_desc: "Establish permanent federal funding for advanced university research, rocketry, electronics, and applied sciences."
 USA_the_marshall_plan: "The Marshall Plan"
 USA_the_marshall_plan_desc: "Provide billions in American economic and industrial aid to rebuild shattered European nations and immunize them against Soviet subversion."
 USA_strategic_air_command: "Strategic Air Command"
 USA_strategic_air_command_desc: "Consolidate long-range strategic bombers under General Curtis LeMay, capable of devastating retaliatory atomic strikes worldwide."
 USA_national_security_act: "National Security Act"
 USA_national_security_act_desc: "Unify the armed forces under the Department of Defense and establish the Central Intelligence Agency to counter communist operations."
 SOV_academy_of_sciences_expansion: "Academy of Sciences Expansion"
 SOV_academy_of_sciences_expansion_desc: "Allocate supreme state resources to Soviet physicists, engineers, and mathematicians in the USSR Academy of Sciences."
 SOV_council_for_mutual_economic_assistance: "Council for Mutual Economic Assistance"
 SOV_council_for_mutual_economic_assistance_desc: "Coordinate industrial production, raw material allocation, and socialist trade across Eastern Europe."
 SOV_warsaw_treaty_organization: "Warsaw Treaty Organization"
 SOV_warsaw_treaty_organization_desc: "Formalize a collective military defensive alliance of socialist states against Western imperialist aggression."
 CZE_vojensky_technicky_ustav: "Vojenský technický ústav (VTÚ)"
 CZE_vojensky_technicky_ustav_desc: "Sjednotit vědecký a vojenský výzkum československého zbrojního průmyslu, elektroniky a radiolokace v novém technickém ústavu."
 POL_politechnika_warszawska_expansion: "Politechnika Warszawska Expansion"
 POL_politechnika_warszawska_expansion_desc: "Rebuild and expand Poland's premier technical polytechnic to train engineers and scientific cadres for national reconstruction."
 POL_central_industrial_district_revival: "Centralny Okręg Przemysłowy Revival"
 POL_central_industrial_district_revival_desc: "Reconstruct heavy industry, steelworks, and chemical complexes in the Central Industrial District."
 GER_max_planck_institute_reconstitution: "Max-Planck-Gesellschaft Reconstitution"
 GER_max_planck_institute_reconstitution_desc: "Reorganize German scientific research outside of military constraints to revive our world-class industrial innovations."

 # -------------------------------------------------------------------------
 # GENERIC UNTHINKABLE FOCUSES
 # -------------------------------------------------------------------------
 generic_unthinkable_reconstruction: "Post-War Reconstruction"
 generic_unthinkable_reconstruction_desc: "Clear wartime ruins, demobilize emergency services, and establish administrative control across our communities."
 generic_unthinkable_infrastructure: "Rebuild Transportation Networks"
 generic_unthinkable_infrastructure_desc: "Repair blown bridges, restore railway arterial connections, and repave vital transit routes."
 generic_unthinkable_civ_factories: "Consumer Industry Expansion"
 generic_unthinkable_civ_factories_desc: "Erect new factories to provide consumer goods and revitalize our commercial economy."
 generic_unthinkable_economic_planning: "Strategic Economic Planning"
 generic_unthinkable_economic_planning_desc: "Direct state capital into priority infrastructure and maximize factory production efficiency."
 generic_unthinkable_armament_effort: "Mobilize Defense Production"
 generic_unthinkable_armament_effort_desc: "Convert industrial plants to military arms and ammunition production to supply our armed forces."
 generic_unthinkable_military_factories: "Expand Munitions Plants"
 generic_unthinkable_military_factories_desc: "Construct modern assembly lines for high-caliber shells, firearms, and mechanized parts."
 generic_unthinkable_military_production: "Wartime Industrial Output"
 generic_unthinkable_military_production_desc: "Enforce streamlined factory operations to surge defense material output."
 generic_unthinkable_research_slot: "National Scientific Academy"
 generic_unthinkable_research_slot_desc: "Endow national universities and technical laboratories to expand our domestic scientific capacity."
 generic_unthinkable_resources: "Prospecting & Synthetic Fuels"
 generic_unthinkable_resources_desc: "Intensify mining surveys and invest in chemical plants for synthetic rubber and fuel synthesis."
 generic_unthinkable_secret_weapons: "Advanced Electronics & Nuclear Studies"
 generic_unthinkable_secret_weapons_desc: "Pioneer cutting-edge research in radar computation, rocket propellants, and atomic physics."

 generic_unthinkable_army_effort: "Reorganize the Ground Forces"
 generic_unthinkable_army_effort_desc: "Absorb lessons from recent global campaigns and reorganize divisions into modern tactical commands."
 generic_unthinkable_equipment_effort: "Standardize Firepower & Artillery"
 generic_unthinkable_equipment_effort_desc: "Issue modern assault carbines, anti-tank launchers, and field artillery across all active formations."
 generic_unthinkable_motorization: "Motorized Logistics"
 generic_unthinkable_motorization_desc: "Equip supply columns and infantry brigades with dependable cross-country trucks and utility vehicles."
 generic_unthinkable_special_forces: "Commando & Mountain Cadres"
 generic_unthinkable_special_forces_desc: "Form specialized elite battalions for high-risk airborne, alpine, and amphibious shock operations."
 generic_unthinkable_armor_effort: "Armored Cavalry Program"
 generic_unthinkable_armor_effort_desc: "Modernize our armored doctrine around medium combat tanks and fast mechanized infantry."
 generic_unthinkable_army_doctrine: "Modern General Staff"
 generic_unthinkable_army_doctrine_desc: "Instill aggressive tactical planning and combined arms warfare at the highest levels of command."

 generic_unthinkable_air_effort: "Modern Aviation Corps"
 generic_unthinkable_air_effort_desc: "Reorganize our air command to meet the demanding standards of mid-century aerial combat."
 generic_unthinkable_jet_effort: "Jet Propulsion & Interceptors"
 generic_unthinkable_jet_effort_desc: "Invest in turbine technology and turbojet fighters to secure supremacy above the battlefields."
 generic_unthinkable_cas_effort: "Close Air Support Tactics"
 generic_unthinkable_cas_effort_desc: "Train fighter-bomber wings to conduct precision rocket and bomb strikes in direct coordination with armor."
 generic_unthinkable_bomber_effort: "Strategic Strike Squadrons"
 generic_unthinkable_bomber_effort_desc: "Commission twin-engine and four-engine bombers capable of reaching enemy industrial bases."
 generic_unthinkable_radar_air_defense: "Radar Shield & Flak Batteries"
 generic_unthinkable_radar_air_defense_desc: "Install early-warning radar arrays and automated flak batteries around vital administrative centers."

 generic_unthinkable_naval_effort: "Naval Coastal Command"
 generic_unthinkable_naval_effort_desc: "Strengthen our naval inspectorate and train sailors in modern surface and undersea defense."
 generic_unthinkable_dockyards: "Slipway Construction"
 generic_unthinkable_dockyards_desc: "Dredge harbor channels and expand state slipways to build and maintain modern combat vessels."
 generic_unthinkable_sub_escort: "Escorts & Modern Submersibles"
 generic_unthinkable_sub_escort_desc: "Prioritize submarine wolfpacks and anti-submarine destroyer escorts for sealane protection."
 generic_unthinkable_capital_ships: "Fleet Capital Ships"
 generic_unthinkable_capital_ships_desc: "Lay down cruisers and fleet flagships to project influence and protect sovereign sea lanes."

 generic_unthinkable_political_crossroads: "Post-War Crossroads"
 generic_unthinkable_political_crossroads_desc: "As the victorious superpowers divide the globe, our nation must choose its destiny in the emerging world order."

 generic_unthinkable_pro_west: "Western Democratic Alignment"
 generic_unthinkable_pro_west_desc: "Embrace liberal democracy, foster ties with London and Washington, and reject totalitarian dogma."
 generic_unthinkable_marshall_aid: "Accept American Recovery Aid"
 generic_unthinkable_marshall_aid_desc: "Welcome Western financial packages, technical missions, and capital imports to accelerate reconstruction."
 generic_unthinkable_western_sphere: "Join the Western Sphere"
 generic_unthinkable_western_sphere_desc: "Sign bilateral defense accords and integrate our forces into the democratic security apparatus."
 generic_unthinkable_anticommunist_crusade: "Anti-Communist Shield"
 generic_unthinkable_anticommunist_crusade_desc: "Outlaw subversive Soviet-funded revolutionary cadres and fortify our society against Comintern infiltration."

 generic_unthinkable_pro_east: "Align with the Soviet Bloc"
 generic_unthinkable_pro_east_desc: "Look toward Moscow for guidance, embrace Marxist-Leninist solidarity, and stand against Western capitalism."
 generic_unthinkable_soviet_mission: "Soviet Military Advisers"
 generic_unthinkable_soviet_mission_desc: "Invite Red Army officers and political commissars to oversee the re-equipping of our armed forces."
 generic_unthinkable_peoples_republic: "Proclaim People's Republic"
 generic_unthinkable_peoples_republic_desc: "Establish a vanguard government, nationalize commanding heights of industry, and mobilize the working class."
 generic_unthinkable_comintern_pact: "Sign the Treaty of Moscow"
 generic_unthinkable_comintern_pact_desc: "Formalize an unbreakable socialist brotherhood pact with the Soviet Union against imperialist aggression."

 generic_unthinkable_fascist_revival: "The Embers of National Renewal"
 generic_unthinkable_fascist_revival_desc: "Reject the dictated post-war consensus, honor the sacrifice of front-line veterans, and revive national radicalism."
 generic_unthinkable_veterans_militia: "Mobilize Patriotic Militias"
 generic_unthinkable_veterans_militia_desc: "Form disciplined volunteer combat legions from seasoned veterans to safeguard the Fatherland."
 generic_unthinkable_fascist_takeover: "National Salvation Dictatorship"
 generic_unthinkable_fascist_takeover_desc: "Dissolve corrupt partisan assemblies and invest supreme state authority in an uncompromising national leader."
 generic_unthinkable_revanchist_crusade: "Crusade for Retribution"
 generic_unthinkable_revanchist_crusade_desc: "Declare our sacred territorial rights and mobilize every citizen for the recovery of lost ancestral lands."

 generic_unthinkable_armed_neutrality: "Armed Neutrality"
 generic_unthinkable_armed_neutrality_desc: "Refuse alignment with either Washington or Moscow, pledging to defend our sovereign borders with uncompromising resolve."
 generic_unthinkable_fortress_nation: "Redoubt & Border Fortifications"
 generic_unthinkable_fortress_nation_desc: "Construct reinforced pillboxes and mountain bunkers along border mountain passes."
 generic_unthinkable_neutral_trade: "Sovereign Trade Pragmatism"
 generic_unthinkable_neutral_trade_desc: "Maintain strict neutrality while exchanging goods and raw materials with all willing trade partners."

 # Ideas
 unthinkable_generic_economic_planning: "Economic Planning Commission"
 unthinkable_generic_economic_planning_desc: "Centralized state investment guarantees rapid building speeds and high factory efficiency."
 unthinkable_generic_military_production: "Surge Production Directives"
 unthinkable_generic_military_production_desc: "State arsenals operate on accelerated quotas to equip the front lines."
 unthinkable_generic_marshall_aid: "Western Recovery Assistance"
 unthinkable_generic_marshall_aid_desc: "Financial stability and industrial equipment from the West boost consumer production and infrastructure."
 unthinkable_generic_anticommunist_crusade: "Anti-Communist Resolve"
 unthinkable_generic_anticommunist_crusade_desc: "Total societal mobilization against Comintern expansion."
 unthinkable_generic_peoples_republic: "Dictatorship of the Proletariat"
 unthinkable_generic_peoples_republic_desc: "Workers and peasants mobilize en masse to build socialism and protect the revolution."
 unthinkable_generic_fascist_revanchism: "Revanchist Resurgence"
 unthinkable_generic_fascist_revanchism_desc: "The burning fire of national pride and defiance drives aggressive military readiness."
 unthinkable_generic_totalitarian_rule: "Totalitarian State Order"
 unthinkable_generic_totalitarian_rule_desc: "Absolute central authority suppresses dissent and enforces complete patriotic compliance."
 unthinkable_generic_armed_neutrality: "Inviolable Neutrality"
 unthinkable_generic_armed_neutrality_desc: "Uncompromising readiness to repel foreign incursions maintains peace and diplomatic standing."

 # -------------------------------------------------------------------------
 # GERMANY EXTENSIONS
 # -------------------------------------------------------------------------
 GER_werwolf_underground: "Rally the Werwolf Underground"
 GER_werwolf_underground_desc: "Activate secret resistance networks and clandestine radio stations to defy Allied military occupation."
 GER_subvert_occupation: "Subvert Allied Military Government"
 GER_subvert_occupation_desc: "Conduct sabotage, organize clandestine veteran circles, and undermine Allied de-militarization efforts."
 GER_recover_hidden_arsenals: "Recover Concealed Arms Caches"
 GER_recover_hidden_arsenals_desc: "Unearth buried weapons, anti-tank munitions, and hidden armored vehicles stashed across remote forests."
 GER_nationalist_coup_d_etat: "Nationalist Liberation Junta"
 GER_nationalist_coup_d_etat_desc: "Strike from the shadows to seize military depots and proclaim an uncompromising nationalist government."
 GER_crusade_for_the_fatherland: "Crusade for the Lost Territories"
 GER_crusade_for_the_fatherland_desc: "Repudiate the Oder-Neisse border and pledge to reclaim East Prussia, Pomerania, and Silesia."

 GER_appeal_to_moscow_antifa: "Antifascist Unity with Moscow"
 GER_appeal_to_moscow_antifa_desc: "Reach out to the Soviet administration and build an alliance of antifascist workers and intellectuals."
 GER_socialist_land_reform: "Democratic Land & Industrial Reform"
 GER_socialist_land_reform_desc: "Expropriate Junkers and industrial monopolists, placing land and factories in the hands of the working class."
 GER_kasernierte_volkspolizei: "Kasernierte Volkspolizei"
 GER_kasernierte_volkspolizei_desc: "Establish barracked armed police units equipped with Soviet arms as the nucleus of a future people's army."
 GER_proclaim_deutsche_demokratische_republik: "Proclaim German Democratic Republic"
 GER_proclaim_deutsche_demokratische_republik_desc: "Establish the German Democratic Republic under the leadership of the SED in fraternal alliance with the USSR."

 # -------------------------------------------------------------------------
 # POLAND EXTENSIONS
 # -------------------------------------------------------------------------
 POL_nsz_national_armed_forces: "Narodowe Siły Zbrojne (NSZ)"
 POL_nsz_national_armed_forces_desc: "Mobilize the National Armed Forces to wage an uncompromising struggle against both Soviet occupants and Western betrayal."
 POL_mobilize_forest_partisans: "Mobilize Forest Partisan Brigades"
 POL_mobilize_forest_partisans_desc: "Rally the cursed soldiers (Żołnierze Wyklęci) hiding in the eastern wilderness into organized fighting brigades."
 POL_anti_communist_anti_allied_struggle: "Refuse All Foreign Diktats"
 POL_anti_communist_anti_allied_struggle_desc: "Condemn the Yalta betrayal and reject any submission to foreign spheres of influence."
 POL_national_salvation_regime: "Government of National Salvation"
 POL_national_salvation_regime_desc: "Institute an authoritarian emergency council to guarantee Poland's uncompromising independence."
 POL_sanacja_and_nsz_intermarium: "Intermarium Reclamation"
 POL_sanacja_and_nsz_intermarium_desc: "Demand the return of the Kresy eastern borderlands and build a powerful independent coalition between the seas."

 # -------------------------------------------------------------------------
 # FRANCE EXTENSIONS
 # -------------------------------------------------------------------------
 FRA_nationalist_resurgence: "Ralliement National"
 FRA_nationalist_resurgence_desc: "Reject the weak parliamentary consensus of the Fourth Republic and rally patriots behind traditional order."
 FRA_rallier_anciens_combattants: "Mobilize Colonial & Metropolitan Veterans"
 FRA_rallier_anciens_combattants_desc: "Unite military veterans, colonial officers, and nationalist leagues to restore national discipline."
 FRA_nouvel_etat_francais: "Proclaim the New French State"
 FRA_nouvel_etat_francais_desc: "Establish an authoritarian executive capable of defending France's empire and destiny by any means necessary."

 # -------------------------------------------------------------------------
 # CZECHOSLOVAKIA EXTENSIONS
 # -------------------------------------------------------------------------
 CZE_nationalist_resurgence: "Nacionální obroda a vlastenecký odpor"
 CZE_nationalist_resurgence_desc: "Odmítnout komunistickou diktaturu i západní lhostejnost a postavit obranu republiky na pevných národních základech."
 CZE_patriotic_guard_militia: "Založení Vlasteneckých gard"
 CZE_patriotic_guard_militia_desc: "Mobilizovat bývalé legionáře a vlasteneckou mládež do ozbrojených gard připravených k obraně hranic."
 CZE_authoritarian_republic: "Vyhlášení autoritativního státu"
 CZE_authoritarian_republic_desc: "Vytvořit pevnou autoritářskou vládu národní spásy, která bez kompromisů ubrání suverenitu a celistvost republiky."

 GER_UNTHINKABLE_DESC: "In the ashes of the Stunde Null, Germany is partitioned into four Allied occupation zones. In the West, democratic politician Konrad Adenauer works tirelessly to stabilize the devastated cities and prepare the foundations for a new Federal Republic under Allied protection."

