 POSTWAR_HELICOPTER_TITLE: "HELICOPTERS"
 POSTWAR_ARTILLERY_TITLE: "ARTILLERY & SAMS"
 POSTWAR_ARMOR_TITLE: "ARMOR & APCS"
 POSTWAR_AIR_TITLE: "JET AVIATION"
 POSTWAR_ELECTRONICS_TITLE: "ELECTRONICS & RADAR"
 POSTWAR_NUCLEAR_TITLE: "NUCLEAR & INDUSTRY"
 POSTWAR_NAVAL_TITLE: "POST-WAR NAVY"
