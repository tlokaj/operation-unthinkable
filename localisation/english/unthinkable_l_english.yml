l_english:
 unthinkable_decisions_category:0 "Operation Unthinkable"
 unthinkable_decisions_category_desc:0 "With the defeat of Germany in Europe, tensions between the Western Allies and the Soviet Union over the fate of Poland and Eastern Europe have reached a breaking point. The British Joint Planning Staff has prepared secret contingency plans to impose the will of the British Empire and the United States upon the USSR."
 unthinkable_draft_war_plans:0 "Commission Joint Planning Staff Report"
 unthinkable_draft_war_plans_desc:0 "Order the Armed Forces Joint Planning Staff to draw up plans for a surprise offensive against Soviet forces in Germany and Poland."
 unthinkable_rearm_wehrmacht_divisions:0 "Reconstitute Surrendered Wehrmacht Divisions"
 unthinkable_rearm_wehrmacht_divisions_desc:0 "To offset the numerical superiority of the Red Army in Central Europe, we can re-equip 10 to 12 surrendered German divisions under Allied command."
 unthinkable_launch_operation:0 "Execute Operation Unthinkable"
 unthinkable_launch_operation_desc:0 "Launch the Allied offensive across the Elbe and toward the Oder-Neisse line to liberate Poland and force Soviet withdrawal."
 unthinkable.1.t:0 "Operation Unthinkable: Joint Planning Staff Report"
 unthinkable.1.d:0 "On May 22, 1945, the British Cabinet's Joint Planning Staff delivered its top-secret assessment for 'Operation Unthinkable.' The declared overall political goal is 'to impose upon Russia the will of the United States and the British Empire' and secure 'a square deal for Poland.'\n\nThe offensive plan proposes a surprise assault by 47 British and American divisions—supported by Polish forces and up to 12 reconstituted German divisions—striking through Dresden and Stettin toward the Oder-Neisse line. However, the Chiefs of Staff warn that the Red Army currently holds a nearly 3-to-1 numerical advantage in Europe, making a quick victory perilous without total commitment."
 unthinkable.1.a:0 "Approve the offensive plan — prepare for July 1st!"
 unthinkable.1.b:0 "Too risky. Prepare the defensive plan instead."
 unthinkable.100.t:0 "Operation Unthinkable Begins!"
 unthinkable.100.d:0 "Barely weeks after the fall of Berlin, artillery once again thunders across Central Europe. Western Allied armored columns have crossed the demarcation line in Germany, launching a massive offensive against Red Army positions in an operation code-named 'Unthinkable.' A third global conflict for the fate of Europe has begun."
 unthinkable.100.a:0 "The world holds its breath..."
 unthinkable.100.b:0 "To arms! Defend the Motherland!"