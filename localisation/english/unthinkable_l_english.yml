 # United Kingdom (ENG)
 ENG_rolls_royce_organization: "Rolls-Royce Limited"
 ENG_rolls_royce_organization_desc: "Founded in Derby, Rolls-Royce is the undisputed world leader in high-performance aero-engines. Its legendary Merlin and Griffon piston engines powered Spitfires, Hurricanes, and Mustangs, while the Meteor powered Cromwell and Centurion tanks. By 1945, its revolutionary Welland, Derwent, and Nene turbojets herald the dawn of the jet age."
 ENG_mio_initial_trait_rolls_royce: "Master of Aero-Engines"
 ENG_mio_trait_rolls_royce_merlin_griffon: "Two-Stage Supercharged Piston Power"
 ENG_mio_trait_rolls_royce_merlin_griffon_desc: "Refinements in two-stage superchargers and 150-octane fuel deliver outstanding high-altitude fighter performance."
 ENG_mio_trait_rolls_royce_nene_derwent: "Centrifugal Jet Turbine Mastery"
 ENG_mio_trait_rolls_royce_nene_derwent_desc: "The Derwent and Nene centrifugal flow jet engines provide unmatched thrust-to-weight ratios and pioneering turbine reliability."

 ENG_gloster_aircraft_organization: "Gloster Aircraft Company"
 ENG_gloster_aircraft_organization_desc: "Based in Gloucestershire, Gloster built the Gloster Meteor—the only Allied jet aircraft to see active combat service in World War II. Its design team specializes in twin-jet interceptors capable of countering high-speed aerial threats."
 ENG_mio_initial_trait_gloster: "Pioneers of Jet Flight"
 ENG_mio_trait_gloster_twin_jet_airframe: "Twin-Engine Jet Architecture"
 ENG_mio_trait_gloster_twin_jet_airframe_desc: "Engine nacelles integrated into mid-wings offer balanced flight characteristics and superior transonic handling."
 ENG_mio_trait_gloster_meteor_cannon_battery: "Nose-Mounted Quad 20mm Hispano Battery"
 ENG_mio_trait_gloster_meteor_cannon_battery_desc: "Four 20mm cannons grouped compactly in the nose provide devastating concentrated firepower against bombers and fighters alike."

 # Soviet Union (SOV)
 SOV_lavochkin_organization: "OKB-301 Lavochkin"
 SOV_lavochkin_organization_desc: "Led by Semyon Alekseyevich Lavochkin in Khimki, this design bureau engineered the formidable La-5FN and La-7 fighters—the mounts of top Soviet aces like Ivan Kozhedub. Renowned for supreme low-altitude agility, radial engine survivability, and rugged construction."
 SOV_mio_initial_trait_lavochkin: "Frontline Dogfight Master"
 SOV_mio_trait_lavochkin_radial_power: "Shvetsov ASh-82FN Radial Integration"
 SOV_mio_trait_lavochkin_radial_power_desc: "Direct-injected 14-cylinder radial engines deliver explosive acceleration and low-altitude climb rates."
 SOV_mio_trait_lavochkin_composite_airframe: "Delta-Wood & Duralumin Composite Construction"
 SOV_mio_trait_lavochkin_composite_airframe_desc: "Clever combinations of compressed laminated wood and light duralumin streamline factory output while resisting battlefield damage."

 SOV_uralvagonzavod_organization: "Uralvagonzavod (Zavod No. 183)"
 SOV_uralvagonzavod_organization_desc: "Evacuated to Nizhny Tagil during the crisis of 1941, Uralvagonzavod grew into the largest tank manufacturing complex in human history. Having produced tens of thousands of T-34-85s, its engineers in 1945 lead the breakthrough transition into the T-44 and T-54 main battle tank series."
 SOV_mio_initial_trait_uralvagonzavod: "Heart of Soviet Armor"
 SOV_mio_trait_uvz_mass_conveyor: "Tagil Assembly Line Flow"
 SOV_mio_trait_uvz_mass_conveyor_desc: "Subdivided automated welding jigs and conveyor tracks enable unparalleled mass production of armored fighting vehicles."
 SOV_mio_trait_uvz_sloped_cast_turret: "Hemispherical Cast Steel Turrets"
 SOV_mio_trait_uvz_sloped_cast_turret_desc: "Pioneering low-profile cast armor turrets dramatically increase ballistic deflection while reducing production man-hours."
 SOV_mio_trait_uvz_d10t_gun_mount: "100mm D-10T Tank Gun Integration"
 SOV_mio_trait_uvz_d10t_gun_mount_desc: "Mounting the ferocious 100mm naval-derivative cannon into medium tank hulls ensures total armor penetration against any Western heavy tank."

 # United States (USA)
 USA_chrysler_tank_plant_organization: "Chrysler Tank Plant (Detroit Arsenal)"
 USA_chrysler_tank_plant_organization_desc: "The government-owned Detroit Arsenal in Warren, Michigan, operated by Chrysler Corporation, was built expressly to apply automotive mass-production techniques to tank warfare. Producing thousands of M4 Shermans and the heavy M26 Pershing, it represents the epitome of mechanized industrial power."
 USA_mio_initial_trait_chrysler_plant: "Automotive Mass Production"
 USA_mio_trait_detroit_assembly_line: "Detroit Automotive Conveyor Automation"
 USA_mio_trait_detroit_assembly_line_desc: "High-precision interchangeable tooling and automotive assembly lines maximize manufacturing tempo and spare parts standardization."
 USA_mio_trait_chrysler_m26_90mm: "90mm M3 Heavy Gun Integration"
 USA_mio_trait_chrysler_m26_90mm_desc: "High-velocity 90mm anti-armor cannons provide the punch needed to knock out Soviet heavy tanks across European plains."
 USA_mio_trait_chrysler_heavy_suspension: "Torsion Bar Running Gear"
 USA_mio_trait_chrysler_heavy_suspension_desc: "Modern torsion-bar suspensions grant a smooth cross-country ride and stable gun-laying on the move."

 # France (FRA)
 FRA_arsenal_aeronautique_organization: "Arsenal de l'Aéronautique"
 FRA_arsenal_aeronautique_organization_desc: "The national state aeronautical research establishment at Châtillon-sous-Bagneux, specializing in daring aerodynamic research, tandem-engine fighters like the VB 10, and experimental jet propulsion."
 FRA_mio_initial_trait_arsenal: "State Aerodynamic Laboratory"
 FRA_mio_trait_arsenal_tandem_power: "Tandem Engine & Contra-Rotating Propellers"
 FRA_mio_trait_arsenal_tandem_power_desc: "Twin inline engines powering contra-rotating propellers cancel torque and maximize streamlined high-speed flight."
 FRA_mio_trait_arsenal_jet_research: "VG-70 Transonic Swept-Wing Research"
 FRA_mio_trait_arsenal_jet_research_desc: "Pioneering French research into swept wings and axial-flow jet propulsion restores French aeronautical preeminence."

 FRA_dassault_organization: "Avions Marcel Dassault"
 FRA_dassault_organization_desc: "Emerging in 1945 under the patriotic leadership of Marcel Bloch (taking his Resistance nom de guerre Dassault), this design office is determined to catapult French aviation into the jet age with sleek, combat-ready jet fighters."
 FRA_mio_initial_trait_dassault: "Visionary Fighter Design"
 FRA_mio_trait_dassault_fighter_spirit: "Aerodynamic Purity & Agility"
 FRA_mio_trait_dassault_fighter_spirit_desc: "Elegant airframe contours emphasize high thrust-to-weight ratios and exceptional maneuverability."
 FRA_mio_trait_dassault_ouragan_project: "MD 450 Ouragan Turbojet Program"
 FRA_mio_trait_dassault_ouragan_project_desc: "The first operational French-designed jet fighter, combining British-style centrifugal turbines with robust French airframes."

 # Czechoslovakia (CZE)
 CZE_avia_postwar_organization: "Avia Praha-Čakovice (n.p.)"
 CZE_avia_postwar_organization_desc: "Nationalized under Presidential Decree in 1945, the historic Avia factory in Prague-Čakovice is famous for producing the Avia S-199 fighter and completing the Avia S-92 / CS-92—the Czechoslovak-built twin-engine Messerschmitt Me 262 jet fighter."
 CZE_mio_initial_trait_avia_postwar: "Nationalized Air Industry"
 CZE_mio_trait_avia_s199_mezek: "Avia S-199 Mezek Production"
 CZE_mio_trait_avia_s199_mezek_desc: "Adapting available Jumo 211 engines to fighter airframes ensures rapid re-equipment of the Czechoslovak Air Force."
 CZE_mio_trait_avia_s92_turbojet: "Avia S-92 Turbojet Assembly"
 CZE_mio_trait_avia_s92_turbojet_desc: "Assembling Me 262 jet fighters with domestic M-04 jet turbines makes Czechoslovakia one of the few nations capable of fielding domestic jet aircraft in 1945."

 CZE_skoda_plzen_postwar_organization: "Závody Škoda Plzeň (n.p.)"
 CZE_skoda_plzen_postwar_organization_desc: "Liberated by General Patton's US 3rd Army in May 1945, the nationalized Škoda Works in Plzeň swiftly rebuilt its shattered workshops to manufacture heavy artillery, anti-tank guns, and overhaul Jagdpanzer 38(t) Hetzers into ST-I armored fighting vehicles."
 CZE_mio_initial_trait_skoda_plzen: "Arsenal of the Republic"
 CZE_mio_trait_skoda_sti_hetzer_rebuild: "ST-I & ST-III Conversion Lines"
 CZE_mio_trait_skoda_sti_hetzer_rebuild_desc: "Rebuilding captured and stockpiled Hetzers into domestic ST-I tank destroyers and training vehicles provides a ready armored striking force."
 CZE_mio_trait_skoda_heavy_artillery_casting: "Plzeň Heavy Gun Forging"
 CZE_mio_trait_skoda_heavy_artillery_casting_desc: "Centuries of metallurgical excellence allow Plzeň to forge some of the most reliable and accurate artillery barrels in Central Europe."

 # Special Projects & Rocketry (Götterdämmerung)
 USA_wernher_von_braun: "Wernher von Braun"
 USA_paperclip_project_hermes_tt: "§YProject Hermes§!: Wernher von Braun and captured V-2 components accelerate American ballistic missile research by §G+25%§! and grant §G+2§! Aerospace Breakthrough Points."
 USA_b36_peacemaker_project_tt: "§YConvair B-36 Peacemaker§!: Strategic Air Command accelerates intercontinental strategic bomber development by §G+35%§! and grants §G+2§! Aerospace Breakthrough Points."
 SOV_osoaviakhim_kapustin_yar_tt: "§YKapustin Yar Proving Ground & R-1 Missile§!: Captured German rocket specialists from Institut Nordhausen establish the 4th State Central Test Range (GTsP-4) in Astrakhan, advancing Soviet ballistic missile development by §G+25%§! and granting §G+2§! Aerospace Breakthrough Points."

