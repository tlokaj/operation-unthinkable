l_english:
 # Decision categories
 unthinkable_sbz_reparations_category: "Soviet Zone Dismantling & Reparations"
 unthinkable_sbz_reparations_category_desc: "The Soviet Military Administration in Germany (SMAD) oversees the extraction of reparations, dismantling of strategic factories, and requisition of technical expertise from the Soviet Occupation Zone to rebuild the devastated Soviet heartland."
 unthinkable_ruhr_recovery_category: "The Ruhr Question & Industrial Recovery"
 unthinkable_ruhr_recovery_category_desc: "The industrial heartland of the Ruhr valley in North Rhine-Westphalia holds the key to European economic recovery. The Western Allies must choose whether to enforce Morgenthau-style deindustrialization and reparations to Moscow, or rebuild the steel mills to fuel European defense."
 unthinkable_jachymov_uranium_category: "The Jáchymov Uranium Deposits"
 unthinkable_jachymov_uranium_category_desc: "The ancient silver and pitchblende mines of Jáchymov (St. Joachimsthal) in western Bohemia hold the richest deposits of uranium ore in continental Europe. Control of this fissile material is critical for the atomic bomb projects of both East and West."
 unthinkable_postwar_conversion_category: "Post-War Reconversion & Demobilization"
 unthinkable_postwar_conversion_category_desc: "With the unconditional surrender of the Axis powers, democratic societies demand the return of their sons and the swift conversion of wartime arsenals to consumer goods production. Resisting this pressure is essential if military readiness for Operation Unthinkable is to be maintained."

 # Decisions
 unthinkable_sov_demand_jachymov_uranium: "Demand Jáchymov Uranium Monopoly"
 unthinkable_sov_demand_jachymov_uranium_desc: "Send a high-level Soviet commission accompanied by NKVD specialists to Prague to demand exclusive extraction rights and delivery of all pitchblende ore to the Soviet atomic program."
 unthinkable_cze_expand_jachymov_mines: "Expand Jáchymovské Doly n.p."
 unthinkable_cze_expand_jachymov_mines_desc: "Deepen the mining shafts and construct processing facilities in Jáchymov to accelerate the extraction of high-grade uranium and tungsten ore."
 unthinkable_allies_intel_mission_jachymov: "Operation Pitchblende (Allied Intelligence)"
 unthinkable_allies_intel_mission_jachymov_desc: "Dispatch OSS and Secret Intelligence Service agents across the Bohemian border to obtain uranium ore samples and establish intelligence assets around the Jáchymov mining complex."
 unthinkable_sov_dismantle_saxon_industry: "Dismantle Heavy Industry in Saxony"
 unthinkable_sov_dismantle_saxon_industry_desc: "Deploy Trophy Brigades to systematically strip machine tool plants and heavy industrial facilities across Saxony, shipping them by rail to the Donbas and Urals."
 unthinkable_sov_dismantle_brandenburg_railways: "Dismantle Secondary Railway Lines in Brandenburg"
 unthinkable_sov_dismantle_brandenburg_railways_desc: "Tear up double-track railway systems and signalling infrastructure across Brandenburg to rebuild shattered logistics arteries between Moscow and Leningrad."
 unthinkable_sov_execute_operation_osoaviachim: "Execute Operation Osoaviachim"
 unthinkable_sov_execute_operation_osoaviachim_desc: "Mobilize the NKVD to round up top German aerospace, rocket, and nuclear scientists across the Soviet Zone and relocate them with their laboratory equipment to Soviet scientific institutes."
 unthinkable_sov_found_sag_corporations: "Form Soviet Joint-Stock Companies (SAG)"
 unthinkable_sov_found_sag_corporations_desc: "Nationalize vital chemical, synthetic, and manufacturing combines in the Soviet Zone into Soviet Joint-Stock Companies (Sowjetische Aktiengesellschaften) to directly supply the Soviet state with manufactured goods."
 unthinkable_halt_western_reparations_to_ussr: "Halt Western Reparations Deliveries to the USSR"
 unthinkable_halt_western_reparations_to_ussr_desc: "In response to Soviet intransigence in Eastern Europe, immediately suspend the shipment of dismantled industrial equipment from the British and American zones to the Soviet Union."
 unthinkable_revitalize_ruhr_coal_and_steel: "Revitalize the Ruhr Coal and Steel Combine"
 unthinkable_revitalize_ruhr_coal_and_steel_desc: "Inject capital and modern machinery into the coal mines and blast furnaces of the Ruhr, restoring peak steel production to support Western reconstruction and military stockpiles."
 unthinkable_abandon_morgenthau_doctrine: "Formally Abandon the Morgenthau Plan"
 unthinkable_abandon_morgenthau_doctrine_desc: "Officially reject any policies aimed at pastoralizing Germany, assuring the German populace that their industrial skills will be preserved under democratic oversight."
 unthinkable_us_concede_to_bring_boys_home: "Concede to the 'Bring the Boys Home' Movement"
 unthinkable_us_concede_to_bring_boys_home_desc: "Yield to domestic political pressure and GI protests across Europe, accelerating the discharge of servicemen and retooling military plants for civilian consumer production."
 unthinkable_us_resist_demobilization_unthinkable: "Resist Demobilization for Allied Preparedness"
 unthinkable_us_resist_demobilization_unthinkable_desc: "Defy public demand and maintain wartime procurement, warning Congress of the growing Soviet menace along the Elbe."
 unthinkable_uk_convert_war_factories_to_housing: "Enact Industrial Reconversion for Public Housing"
 unthinkable_uk_convert_war_factories_to_housing_desc: "Divert heavy manufacturing lines and state funding from munitions towards prefab housing and reconstruction of war-damaged British cities."
 unthinkable_uk_emergency_munitions_act: "Enact Emergency Munitions Act"
 unthinkable_uk_emergency_munitions_act_desc: "Place British armaments factories on an emergency schedule, accumulating ordnance and weapons for the Allied forces in Germany."

 # Ideas
 unthinkable_jachymov_soviet_pipeline: "Jáchymov Uranium Pipeline"
 unthinkable_jachymov_soviet_pipeline_desc: "High-grade pitchblende ore extracted from the Jáchymov mines flows directly to Soviet Laboratory No. 2, providing the fissile isotope foundation for the RDS-1 atomic program."
 unthinkable_jachymov_soviet_monopoly_cze: "Soviet Uranium Monopoly"
 unthinkable_jachymov_soviet_monopoly_cze_desc: "Under a secret treaty signed with Moscow, the nationalized Jáchymov mines operate under joint Czechoslovak-Soviet oversight, with all radioactive ore exclusively earmarked for the USSR."
 unthinkable_jachymov_western_diversion: "Allied Uranium Samples & Extraction"
 unthinkable_jachymov_western_diversion_desc: "Allied intelligence operations have secured vital samples and geological surveys from Jáchymov, contributing valuable insights to Anglo-American nuclear developments."
 unthinkable_jachymov_nationalized_independent: "Sovereign Uranium Reserve"
 unthinkable_jachymov_nationalized_independent_desc: "Czechoslovakia retains full sovereign control over the Jáchymov pitchblende deposits, refusing foreign monopolies and utilizing domestic resources for national industry."
 unthinkable_sbz_plunder_active: "Soviet Zone Dismantling Program"
 unthinkable_sbz_plunder_active_desc: "Whole factory complexes, tooling machines, and rolling stock from eastern Germany are being transported eastwards to re-equip destroyed Soviet industrial centers."
 unthinkable_osoaviachim_tech_boost: "Operation Osoaviachim Technical Assets"
 unthinkable_osoaviachim_tech_boost_desc: "Hundreds of recruited and relocated German engineers, rocketry specialists, and physicists are directly assisting Soviet design bureaus."
 unthinkable_sag_enterprises: "Sowjetische Aktiengesellschaften (SAG)"
 unthinkable_sag_enterprises_desc: "Vital industrial plants in the Soviet zone operate under direct Soviet ownership, providing a steady supply of finished goods without the need for plant relocation."
 unthinkable_ruhr_revitalized: "Revitalized Ruhr Heavy Industry"
 unthinkable_ruhr_revitalized_desc: "The blast furnaces and rolling mills of the Ruhr have resumed peak production, churning out steel and raw materials vital for Western defense."
 unthinkable_reparation_cutoff: "Suspension of Western Zone Reparations"
 unthinkable_reparation_cutoff_desc: "The Western Allies have unilaterally halted shipments of dismantled machinery from the Ruhr to the Soviet Union, triggering severe diplomatic tension."
 unthinkable_morgenthau_scrapped: "Morgenthau Plan Abandoned"
 unthinkable_morgenthau_scrapped_desc: "The prospect of reducing Germany to a pastoral economy has been abandoned, restoring economic hope to the German population."
 unthinkable_peace_dividend: "Post-War Peace Dividend"
 unthinkable_peace_dividend_desc: "Military factories have been converted to domestic consumer products, filling store shelves and raising living standards at the expense of military stockpiles."
 unthinkable_war_footing_maintained: "Maintained War Footing"
 unthinkable_war_footing_maintained_desc: "Despite popular war weariness, the state apparatus retains a high degree of industrial mobilization, ready for immediate hostilities."
 unthinkable_british_austerity_production: "Austerity Reconversion Program"
 unthinkable_british_austerity_production_desc: "Britain prioritizes the rebuilding of civilian infrastructure, civilian housing, and exports to avert national insolvency."

 # Events
 unthinkable_econ.1.t: "Soviet Demand: The Jáchymov Uranium Secret Agreement"
 unthinkable_econ.1.d: "A confidential Soviet delegation headed by NKVD and Soviet Academy of Sciences officials has arrived in Prague. Citing the fraternal ties between our nations and the necessity of safeguarding the Slavic world, they present a secret draft treaty: 'Agreement on the Expansion of Ore Mining in Jáchymov'. Under this agreement, all radioactive pitchblende and radium-bearing ore would be extracted by a state enterprise and shipped exclusively to the Soviet Union. In return, Moscow promises deliveries of grain, coal, and diplomatic backing. Refusing would preserve our sovereign monopoly, but would deeply offend Stalin and risk Soviet retribution."
 unthinkable_econ.1.a: "Sign the Secret Treaty with Moscow"
 unthinkable_econ.1.b: "Refuse the Monopoly - Defend National Sovereignty"
 unthinkable_econ.2.t: "The Jáchymov Uranium Pipeline Secured"
 unthinkable_econ.2.d: "The Czechoslovak government has officially agreed to the secret Jáchymov treaty. Trainloads of high-grade Bohemian pitchblende ore are now being routed under tight NKVD security to Moscow and Chelyabinsk. Academician Igor Kurchatov reports that this steady supply of uranium ore guarantees that the first Soviet atomic pile (F-1) and the RDS-1 plutonium bomb will become reality years ahead of previous projections."
 unthinkable_econ.2.a: "Excellent. The Motherland Shall Have Her Shield!"
 unthinkable_econ.3.t: "Czechoslovakia Rejects the Uranium Monopoly!"
 unthinkable_econ.3.d: "Defying Soviet requests, the government in Prague has formally rejected our demand for an exclusive uranium monopoly, asserting their right to retain sovereign control over the Jáchymov deposits. Beria and the Special Committee warn Comrade Stalin that without Jáchymov uranium, our nuclear research will be crippled. We must decide whether to threaten Prague with military intervention or accept their stance for now."
 unthinkable_econ.3.a: "Issue a Stern Ultimatum to Prague!"
 unthinkable_econ.3.b: "Accept the Decision for Now"
 unthinkable_econ.4.t: "Operation Pitchblende: Intelligence at Jáchymov"
 unthinkable_econ.4.d: "Our intelligence operatives, collaborating with local Czechoslovak contacts in the Sudetenland, have completed a covert reconnaissance of the Jáchymov mining district. They have successfully retrieved several crates of raw pitchblende samples, precise geological depth charts, and detailed reports on Soviet NKVD activities in the area. These materials provide invaluable data for our atomic scientists and confirm the strategic significance of the region."
 unthinkable_econ.4.a: "Extract the Samples and Technical Intelligence"
 unthinkable_econ.4.b: "Maintain Deep Cover and Observe Transports"
 unthinkable_econ.5.t: "Soviet Ultimatum on Jáchymov"
 unthinkable_econ.5.d: "Soviet Ambassador Zorin has handed President Beneš an urgent diplomatic note. Moscow makes it unequivocally clear: either Czechoslovakia accedes to the uranium agreement, or the Red Army will take all necessary measures to ensure Soviet strategic security. Tanks of the Red Army in eastern Austria and Saxony are reportedly on high alert."
 unthinkable_econ.5.a: "Yield to the Ultimatum under Protest"
 unthinkable_econ.5.b: "Defy the Threat and Appeal to the West!"
 unthinkable_econ.6.t: "Czechoslovakia Appeals for Protection"
 unthinkable_econ.6.d: "The Czechoslovak government has issued an urgent, secret appeal to London and Washington, reporting that Moscow is threatening invasion over control of the Jáchymov uranium mines. President Beneš asks for formal Western security guarantees. Intervening could deter Soviet aggression, but could also act as the catalyst for immediate conflict."
 unthinkable_econ.6.a: "Extend an Ironclad Guarantee to Prague!"
 unthinkable_econ.6.b: "We Cannot Risk War Over Jáchymov"
 unthinkable_econ.21.t: "Western Allies Halt Reparations from the Ruhr!"
 unthinkable_econ.21.d: "General Lucius D. Clay and British authorities have officially declared an immediate suspension of all industrial reparations deliveries from the Western occupation zones to the USSR. The Allies claim that the Soviet Union has failed to treat Germany as an economic whole and is violating the Potsdam accords. Millions of tons of dismantled machinery, machine tools, and rolling stock earmarked for our reconstruction are now permanently withheld in the West."
 unthinkable_econ.21.a: "A Flagrant Violation of the Potsdam Agreement!"
 unthinkable_econ.21.b: "Seize Western Assets in the Soviet Zone in Retaliation"
