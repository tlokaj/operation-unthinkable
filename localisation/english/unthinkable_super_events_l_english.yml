 # Tension Meter Tooltip & Actions
 COLD_WAR_TENSION_TOOLTIP: "§HThe Cold War Tension Index§!\nMeasures the proximity to armed conflict between the Western Allies and the Soviet Union in Europe.\n\n§WCurrent Value:§! [?global.unthinkable_tension|0]%\n§WCurrent Phase:§! [GetColdWarTensionStatus]\n\n§CEscalation Triggers:§!\n- Re-arming Wehrmacht divisions in the British zone (+15%)\n- Confrontations along the Morgan Line in Trieste (+10%)\n- Polish underground (WiN) armed uprising (+10%)\n- Demarcation air corridor shootdowns (+10%)\n- Atomic diplomatic ultimatums (+25%)\n\n§GDe-escalation Measures:§!\n- Diplomatic accords at Potsdam (-15%)\n- Concessions on demarcation checkpoints (-10%)\n\nAt §R100% Tension§!, armed conflict is triggered immediately!"
 
 # Action Buttons
 unthinkable_tension_probe_btn_tt: "§HExecute Border Reconnaissance Flight§!\nSend RAF / USAAF reconnaissance flights across the Soviet demarcation line.\n§RIncreases Tension by +5%§!\n§YGains Demarcation Intelligence§!"
 unthinkable_tension_deescalate_btn_tt: "§HInitiate Direct Demarche / Hot-Line Talk§!\nOrder Allied commanders to de-escalate frontline checkpoints.\n§GDecreases Tension by -5%§!\n§YCost: 25 Political Power§!"
