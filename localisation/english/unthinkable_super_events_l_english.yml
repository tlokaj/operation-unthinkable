l_english:
 # Super-Events System
 UNTHINKABLE_SE_OPERATION_UNTHINKABLE_T: "OPERATION UNTHINKABLE"
 UNTHINKABLE_SE_OPERATION_UNTHINKABLE_D: "\"The overall or total object is to impose upon Russia the will of the United States and the British Empire. Even though 'the will' of these two countries may be considered as merely a square deal for Poland, that does not necessarily limit the military commitment.\""
 UNTHINKABLE_SE_OPERATION_UNTHINKABLE_AUTHOR: "— British War Cabinet, Joint Planning Staff (May 22, 1945)"
 UNTHINKABLE_SE_OPERATION_UNTHINKABLE_BTN: "The clash of titans has begun."

 UNTHINKABLE_SE_TRINITY_TEST_T: "THE TRINITY TEST"
 UNTHINKABLE_SE_TRINITY_TEST_D: "\"We knew the world would not be the same. A few people laughed, a few people cried, most people were silent. I remembered the line from the Hindu scripture, the Bhagavad-Gita: 'Now I am become Death, the destroyer of worlds.'\""
 UNTHINKABLE_SE_TRINITY_TEST_AUTHOR: "— J. Robert Oppenheimer (Alamogordo, July 16, 1945)"
 UNTHINKABLE_SE_TRINITY_TEST_BTN: "A sinister sun rises over the Jornada del Muerto."

 UNTHINKABLE_SE_FIRST_NUKE_EUROPE_T: "ATOMIC FIRE IN EUROPE"
 UNTHINKABLE_SE_FIRST_NUKE_EUROPE_D: "\"Sixteen hours ago an American airplane dropped one bomb on the continent. It is an harnessing of the basic power of the universe. The force from which the sun draws its power has been loosed against those who brought war to mankind.\""
 UNTHINKABLE_SE_FIRST_NUKE_EUROPE_AUTHOR: "— President Harry S. Truman (White House Address)"
 UNTHINKABLE_SE_FIRST_NUKE_EUROPE_BTN: "Prometheus has unchained the apocalypse."

 UNTHINKABLE_SE_FALL_OF_BERLIN_T: "THE FALL OF BERLIN"
 UNTHINKABLE_SE_FALL_OF_BERLIN_D: "\"We may have to fight the Russians now or later. If we have to do it, why not now while we have the army here with its fists balled up? Let's kick their behinds back to Moscow!\""
 UNTHINKABLE_SE_FALL_OF_BERLIN_AUTHOR: "— General George S. Patton Jr."
 UNTHINKABLE_SE_FALL_OF_BERLIN_BTN: "The ruins of the Reichstag echo with Allied boots."

 UNTHINKABLE_SE_FALL_OF_MOSCOW_T: "THE FALL OF MOSCOW"
 UNTHINKABLE_SE_FALL_OF_MOSCOW_D: "\"The Red Star over the Kremlin has been shattered. The greatest totalitarian machine in the East has crumbled under the united wrath of the free world. Yet across the vast, frozen plains, the ashes still smolder.\""
 UNTHINKABLE_SE_FALL_OF_MOSCOW_AUTHOR: "— Supreme Headquarters Allied Expeditionary Force (SHAEF)"
 UNTHINKABLE_SE_FALL_OF_MOSCOW_BTN: "Victory in the East, whatever the cost."

 UNTHINKABLE_SE_POLISH_UPRISING_T: "THE POLISH UPRISING"
 UNTHINKABLE_SE_POLISH_UPRISING_D: "\"We did not shed our blood for six long years of agony merely to exchange the black terror of the Gestapo for the red terror of the NKVD. Poland will never surrender her freedom. To arms!\""
 UNTHINKABLE_SE_POLISH_UPRISING_AUTHOR: "— General Władysław Anders & The Underground Command"
 UNTHINKABLE_SE_POLISH_UPRISING_BTN: "Jeszcze Polska nie zginęła!"

 # Scripted Localization Fallback
 UNTHINKABLE_SE_UNKNOWN_T: "HISTORICAL FLASHPOINT"
 UNTHINKABLE_SE_UNKNOWN_D: "\"Events have overtaken the peace of nations. The destiny of the post-war world is now being forged in fire.\""
 UNTHINKABLE_SE_UNKNOWN_AUTHOR: "— War Correspondent Dispatch"
 UNTHINKABLE_SE_UNKNOWN_BTN: "History marches on."

